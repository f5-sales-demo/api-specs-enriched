# Schema Overrides — Local patches for upstream spec gaps
# Purpose: Inject missing oneOf sibling fields until upstream api-specs fixes land
# Usage: scripts/utils/schema_override_enricher.py (runs during merge phase)
# Tracking: Each override references the upstream issue requesting the permanent fix

version: "1.0.0"
description: >
  Local overrides for missing schema properties in upstream OpenAPI specs.
  Each entry injects sibling fields and updates x-ves-oneof-field-* arrays
  for oneOf groups that the upstream spec incompletely declares.
  Overrides are temporary — remove each entry when the upstream fix ships.

# The healthcheck entry was removed after investigation revealed that the
# 4 DNS variants (dns_health_check, dns_proxy_icmp_health_check, etc.)
# belong to separate resource types (dns_lb_health_check and dns_proxy),
# not to the general /healthchecks endpoint used by HTTP load balancers.
# See issue #294 for context.
overrides:
  securemesh_site_v2_segment_network:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1053"
    description: >-
      Sanitized live evidence on 2026-08-26: replacing a non-operational staged
      Secure Mesh Site v2 with a named Segment reference returned 200 and GET
      returned the same reference unchanged. Restoring the snapshot returned 200
      and the canonical user configuration matched its pre-probe hash.
    schemas:
      - pattern: "^securemesh_site_v2SegmentVRFSettingType$"
        inject_properties:
          segment_network:
            allOf:
              - $ref: "#/components/schemas/ioschemaObjectRefType"
            x-f5xc-references:
              - resource_kind: segment
                field_path: segment_network
                gated_by: null
                required: false
                cardinality: single

  securemesh_site_v2_resource_version:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1159"
    description: >-
      Sanitized live evidence on 2026-08-25: GET returned resource_version as a
      string; a replace echoing the current token succeeded (200); the same
      token after that write was rejected (409); and readback showed the rejected
      stale write did not change spec. The token is server-assigned and only
      demonstrated on replace, never user configuration.
    schemas:
      - pattern: "^securemesh_site_v2GetResponse$"
        inject_properties:
          resource_version:
            type: string
            x-f5xc-concurrency-token:
              server_assigned: true
              echo_on_operations: [replace]
      - pattern: "^securemesh_site_v2ReplaceRequest$"
        inject_properties:
          resource_version:
            type: string
            x-f5xc-concurrency-token:
              server_assigned: true
              echo_on_operations: [replace]

  securemesh_site_v2_interface_read_fields:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1049"
    description: >-
      Secure Mesh v2 GET returned boolean interface fields is_management and
      is_primary on 2026-08-25. Their write mutability was not probed, so both
      are declared read-only rather than inferred as configuration inputs.
    schemas:
      - pattern: "^securemesh_site_v2Interface$"
        inject_properties:
          is_management:
            type: boolean
            readOnly: true
          is_primary:
            type: boolean
            readOnly: true

  registration_image_download:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1485"
    description: >-
      Image download URLs are signed credentials. Mark both response properties
      sensitive so generated clients and Terraform providers protect them in
      diagnostics and state output.
    schemas:
      - pattern: "^registrationGetImageDownloadUrlReq$"
        set_property_extensions:
          provider:
            x-f5xc-recommended-value: "KVM"
            x-f5xc-description-medium: >-
              Deployment platform identifier for the requested Customer Edge
              image.
      - pattern: "^registrationGetImageDownloadUrlResp$"
        inject_extensions:
          x-f5xc-terraform-resource: "xcsh_site_image"
          x-f5xc-category: "Sites"
          x-f5xc-description-medium: >-
            Signed Customer Edge image and checksum URLs for a requested
            deployment platform.
        set_property_extensions:
          image_download_url:
            x-f5xc-sensitive: true
            x-f5xc-description-medium: >-
              Signed URL for the requested Customer Edge image.
          image_md5_download_url:
            x-f5xc-sensitive: true
            x-f5xc-description-medium: >-
              Signed URL for the requested Customer Edge image MD5 checksum.

  token_cloud_init:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1485"
    description: >-
      Secure Mesh v2 cloud-init contains a one-time site node token. Mark the
      response sensitive and publish it as a generated create-once Terraform
      resource.
    schemas:
      - pattern: "^tokenGetCloudInitConfigResp$"
        inject_extensions:
          x-f5xc-terraform-resource: "xcsh_site_cloud_init"
          x-f5xc-category: "Sites"
          x-f5xc-description-medium: >-
            Site-scoped Customer Edge cloud-init containing a one-time Secure
            Mesh v2 node registration token.
        set_property_extensions:
          cloud_init_config:
            x-f5xc-sensitive: true
            x-f5xc-description-medium: >-
              Complete cloud-init containing the site-scoped one-time node
              token.

  secret_payloads:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1492"
    description: >-
      Secret URL fields carry either Base64 plaintext or a sealed secret
      envelope. Mark both forms sensitive so generated Terraform providers do
      not render credential material in plans or diagnostics.
    schemas:
      - pattern: "^schemaClearSecretInfoType$"
        set_property_extensions:
          url:
            x-f5xc-sensitive: true
      - pattern: "^schemaBlindfoldSecretInfoType$"
        set_property_extensions:
          location:
            x-f5xc-sensitive: true

  registration_approval:
    upstream_issue: "f5-sales-demo/terraform-provider-xcsh#1206"
    description: >-
      registrationApprovalReq lacks a top-level `state` in the upstream swagger,
      and needs an x-f5xc-action marker so downstream codegen emits an
      action-style resource (approve) rather than CRUD.
    schemas:
      - pattern: "^registrationApprovalReq$"
        inject_properties:
          state:
            $ref: "#/components/schemas/registrationObjectState"
        inject_extensions:
          x-f5xc-action: "approve"
        # #1142: passport carries no x-ves-required upstream, yet the API enforces
        # it. Verified live 2026-07-30 against registration
        # r-d2e92964-...-615e9b2daf93 in the f5-sales-demo tenant:
        #
        #   POST /api/register/namespaces/system/registration/{name}/approve
        #     without passport -> 500 "Validation approval: Passport is required"
        #     with passport    -> gets past that check and fails later, on
        #                         "Registration state transition ONLINE to
        #                         APPROVED is forbidden"
        #
        # Presence is what is checked, and it is checked before the state gate: a
        # deliberately wrong passport ({cluster_name: "not-this-site"}) reached the
        # same state error. Whether the VALUE is validated after that gate is not
        # observable on an already-approved registration and remains unmeasured.
        #
        # This absence is why terraform-provider-xcsh#636 failed with a 500 and why
        # that repository carries tools/action-derived-fields.json to read the
        # passport off the object being approved. The workaround exists because the
        # spec did not say the field was required; saying so here is the fix.
        set_property_extensions:
          passport:
            x-ves-required: "true"

  site_upgrade_requests:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1142"
    description: >-
      siteUpgradeSWRequest and siteUpgradeOSRequest mark `force` as
      x-ves-required upstream, but the API does not enforce it. Marking it
      required makes a generator force every caller to state a value for a flag
      whose documented purpose is to override the platform's own safety checks
      ("force upgrade even when logic checks are in place to not allow software
      upgrades, i.e. OS upgrade in progress"). That is the wrong thing to make
      unavoidable.
    schemas:
      - pattern: "^siteUpgrade(SW|OS)Request$"
        # Verified live 2026-07-30 against site cem1-l1. BOTH endpoints were probed:
        # the pattern covers two distinct RPCs, and assuming they validate alike
        # would be exactly the kind of unmeasured extension this issue is about.
        #
        #   POST /api/config/namespaces/system/sites/cem1-l1/upgrade_sw
        #     omitting BOTH force and version -> 400 "version empty in the request"
        #     omitting force only             -> 200
        #   POST /api/config/namespaces/system/sites/cem1-l1/upgrade_os
        #     omitting BOTH force and version -> 400 "version empty in the request"
        #     omitting force only             -> 200
        #
        # Identical on both. The API names `version` and never mentions `force`, so
        # requiredness here is asserted by the marker alone. `namespace` and `name`
        # are path parameters and keep their markers.
        #
        # Not corrected here, and it leaves a contradiction this change does not
        # resolve: x-f5xc-minimum-configuration.required_fields still lists `force`,
        # so the published metadata says optional in one field and required in
        # another. scripts/compile_catalog.py:565 exports that list to the catalog as
        # `requiredFields`, so the contradiction reaches consumers, not just the spec
        # file. It is not patched for these two schemas because the field is derived
        # from "all properties" and ignores requiredness entirely — 12,377 of 14,729
        # schemas are affected, and special-casing two would make #1150 harder to fix
        # rather than easier. Downstream action codegen already declines to consult
        # it, for this exact reason.
        # NEGATED, not removed. The contract-diff gate rejects deleting a key
        # upstream provides — it exists to stop the enriched specs quietly dropping
        # contract data, and removing these four produced 4 violations. Changing the
        # VALUE is classified additive (scripts/utils/additive_allowlist.py), and
        # rightly so: relaxing a requirement cannot break a caller who already sends
        # the field.
        #
        # Negating is better than removing anyway. It leaves the disagreement with F5
        # visible in the artifact — upstream asserts "true", we assert "false" — rather
        # than erasing the evidence that upstream ever said it. Every consumer tests
        # for the string "true" (the provider's convert.go and actionPropIsRequired,
        # and _has_required_validation_rules here), so "false" reads as not-required.
        set_property_extensions:
          force:
            x-ves-required: "false"
        set_property_extension_keys:
          force:
            x-ves-validation-rules:
              ves.io.schema.rules.message.required: "false"
            x-validation-rules:
              ves.io.schema.rules.message.required: "false"

  nested_string_maps:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1391"
    description: >-
      Add explicit string additionalProperties contracts for shared metadata (labels, annotations)
      and other true string maps to establish deterministic value types for downstream codegen.
    schemas:
      - pattern: "^schemaObjectMetaType$"
        set_property_extensions:
          labels:
            additionalProperties:
              type: "string"
          annotations:
            additionalProperties:
              type: "string"
      - pattern: "^network_interfaceStaticIpParametersClusterType$"
        set_property_extensions:
          interface_ip_map:
            additionalProperties:
              type: "string"
      - pattern: "^schemasegmentEdgeData$"
        set_property_extensions:
          dst_labels:
            additionalProperties:
              type: "string"
          src_labels:
            additionalProperties:
              type: "string"
      - pattern: "^tenantLastLoginMap$"
        set_property_extensions:
          last_login_map:
            additionalProperties:
              type: "string"
      - pattern: "^origin_poolOriginServerType$"
        set_property_extensions:
          labels:
            additionalProperties:
              type: "string"
