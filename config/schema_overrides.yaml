# Schema Overrides — Local patches for upstream spec gaps
# Purpose: Inject missing oneOf sibling fields until upstream api-specs fixes land
# Usage: scripts/utils/schema_override_enricher.py (runs during merge phase)
# Tracking: Each override references the upstream issue requesting the permanent fix

version: "1.0.0"
description: >
  Local overrides for missing schema properties in upstream OpenAPI specs.
  Each entry injects sibling fields and updates x-ves-oneof-field-* arrays
  for oneOf groups that the upstream spec incompletely declares.
  Overrides are temporary — remove each entry when the upstream fix ships.

# The healthcheck entry was removed after investigation revealed that the
# 4 DNS variants (dns_health_check, dns_proxy_icmp_health_check, etc.)
# belong to separate resource types (dns_lb_health_check and dns_proxy),
# not to the general /healthchecks endpoint used by HTTP load balancers.
# See issue #294 for context.
overrides:
  securemesh_site_v2_selection_and_drain:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1738"
    description: >-
      Current XC create/read probes retain the pinned legacy request's geographic
      RE selection and percentage-based node drain setting. Restore both choice
      members. Persistence does not establish realized selection or upgrade behavior.
    schemas:
      - pattern: "^viewsRegionalEdgeSelection$"
        oneof_group: re_selection_choice
        complete_variants: [geo_proximity, specific_geography, specific_re]
        inject_properties:
          specific_geography:
            type: string
            description: Geographic selection for the site's Regional Edge connections.
      - pattern: "^viewsKubernetesUpgradeDrainConfig$"
        oneof_group: drain_max_unavailable_choice
        complete_variants: [drain_max_unavailable_node_count, drain_max_unavailable_node_percentage]
        inject_properties:
          drain_max_unavailable_node_percentage:
            type: integer
            format: int64
            description: Maximum percentage of nodes unavailable during upgrade draining.

  securemesh_site_v2_interface_addressing:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1738"
    description: >-
      Current XC create/read round trips on isolated unregistered AWS SMSv2
      objects retain static interface DNS, DHCP-server settings, option 82 and
      excluded address pools. Restore these missing protobuf-backed properties.
      API persistence does not establish realized DHCP service on every platform.
    schemas:
      - pattern: "^securemesh_site_v2Interface$"
        oneof_group: address_choice
        complete_variants: [dhcp_client, dhcp_server, no_ipv4_address, static_ip]
        inject_properties:
          dhcp_server:
            allOf:
              - $ref: "#/components/schemas/network_interfaceDHCPServerParametersType"
            description: DHCP server configuration for this interface.
      - pattern: "^network_interfaceStaticIpParametersNodeType$"
        inject_properties:
          dns_server:
            type: string
            description: DNS server address for the static interface configuration.
      - pattern: "^network_interfaceDHCPServerParametersType$"
        inject_properties:
          dhcp_option82_tag:
            type: string
            description: DHCP option 82 tag.
      - pattern: "^network_interfaceDHCPPoolType$"
        inject_properties:
          exclude:
            type: boolean
            description: Exclude this address range from DHCP allocation.

  virtual_site_immutable_selection:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1738"
    description: >-
      Virtual-site ReplaceSpecType has no fields. Live selector PUT returns the
      old selector unchanged, while CreateSpecType accepts selector and site type.
      Consumers must recreate a virtual site to change either creation field.
    schemas:
      - pattern: "^schemavirtual_siteCreateSpecType$"
        set_property_extensions:
          site_selector:
            x-field-mutability: immutable
          site_type:
            x-field-mutability: immutable

  service_policy_rule_required_actions:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1667"
    description: >-
      Sanitized live evidence from marketplace#1269: XC rejects an inline
      service-policy rule when either action or waf_action is absent. The neutral
      WAF selection is none: {}, while waf_skip_processing and
      app_firewall_detection_control remain the other valid action_type variants.
      Requiredness belongs to each rule schema rather than to a dependency on the
      parent service policy.
    schemas:
      - pattern: "^schemaservice_policy_rule(Create|Global|Replace)SpecType$"
        set_property_extensions:
          action:
            x-ves-required: "true"
          waf_action:
            x-ves-required: "true"

  securemesh_site_v2_segment_network:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1053"
    description: >-
      Sanitized live evidence on 2026-08-26: replacing a non-operational staged
      Secure Mesh Site v2 with a named Segment reference returned 200 and GET
      returned the same reference unchanged. Restoring the snapshot returned 200
      and the canonical user configuration matched its pre-probe hash.
    schemas:
      - pattern: "^securemesh_site_v2SegmentVRFSettingType$"
        inject_properties:
          segment_network:
            allOf:
              - $ref: "#/components/schemas/ioschemaObjectRefType"
            x-f5xc-references:
              - resource_kind: segment
                field_path: segment_network
                gated_by: null
                required: false
                cardinality: single

  securemesh_site_v2_resource_version:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1159"
    description: >-
      Sanitized live evidence on 2026-08-25: GET returned resource_version as a
      string; a replace echoing the current token succeeded (200); the same
      token after that write was rejected (409); and readback showed the rejected
      stale write did not change spec. The token is server-assigned and only
      demonstrated on replace, never user configuration.
    schemas:
      - pattern: "^securemesh_site_v2GetResponse$"
        inject_properties:
          resource_version:
            type: string
            x-f5xc-concurrency-token:
              server_assigned: true
              echo_on_operations: [replace]
      - pattern: "^securemesh_site_v2ReplaceRequest$"
        inject_properties:
          resource_version:
            type: string
            x-f5xc-concurrency-token:
              server_assigned: true
              echo_on_operations: [replace]

  securemesh_site_v2_interface_read_fields:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1049"
    description: >-
      Secure Mesh v2 GET returned boolean interface fields is_management and
      is_primary on 2026-08-25. Their write mutability was not probed, so both
      are declared read-only rather than inferred as configuration inputs.
    schemas:
      - pattern: "^securemesh_site_v2Interface$"
        inject_properties:
          is_management:
            type: boolean
            readOnly: true
          is_primary:
            type: boolean
            readOnly: true

  securemesh_site_v2_ethernet_interface_requiredness:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1666"
    description: >-
      The SMSv2 AWS interface contract is MAC-bound: mac is required and device
      is optional. Correct markers before requiredness derivation.
    schemas:
      - pattern: "^viewssecuremesh_site_v2EthernetInterfaceType$"
        set_property_extensions:
          mac:
            x-ves-required: "true"
            x-f5xc-required-for:
              create: true
          device:
            x-ves-required: "false"
            x-f5xc-required-for:
              create: false
        set_property_extension_keys:
          mac:
            x-ves-validation-rules:
              ves.io.schema.rules.message.required: "true"
            x-validation-rules:
              ves.io.schema.rules.message.required: "true"
          device:
            x-ves-validation-rules:
              ves.io.schema.rules.message.required: "false"
            x-validation-rules:
              ves.io.schema.rules.message.required: "false"

  securemesh_site_v2_node_public_ip_nullability:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1684"
    description: >-
      Sanitized live UAT on 2026-09-02 observed an omitted node public_ip read
      back as null. Model the wire value as nullable so generated clients do not
      normalize absence to an empty string and create perpetual state drift.
    schemas:
      - pattern: "^viewssecuremesh_site_v2Node$"
        set_property_extensions:
          public_ip:
            nullable: true

  registration_image_download:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1485"
    description: >-
      Image download URLs are signed credentials. Mark both response properties
      sensitive so generated clients and Terraform providers protect them in
      diagnostics and state output.
    schemas:
      - pattern: "^registrationGetImageDownloadUrlReq$"
        set_property_extensions:
          provider:
            x-f5xc-recommended-value: "KVM"
            x-f5xc-description-medium: >-
              Deployment platform identifier for the requested Customer Edge
              image.
      - pattern: "^registrationGetImageDownloadUrlResp$"
        inject_extensions:
          x-f5xc-terraform-resource: "xcsh_site_image"
          x-f5xc-category: "Sites"
          x-f5xc-description-medium: >-
            Signed Customer Edge image and checksum URLs for a requested
            deployment platform.
        set_property_extensions:
          image_download_url:
            x-f5xc-sensitive: true
            x-f5xc-description-medium: >-
              Signed URL for the requested Customer Edge image.
          image_md5_download_url:
            x-f5xc-sensitive: true
            x-f5xc-description-medium: >-
              Signed URL for the requested Customer Edge image MD5 checksum.

  token_site_bound_jwt:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1733"
    description: >-
      The current upstream token schemas omit the established token type, SMSv2
      site binding, and server-issued JWT content. Restore the fields documented
      by the legacy token protobuf so SMSv2 providers can request a JWT bound to
      one site and protect the returned registration credential.
    schemas:
      - pattern: "^tokenCreateSpecType$"
        inject_properties:
          type:
            type: integer
            format: int32
            description: Token type, where 0 is NORMAL and 1 is JWT.
            enum: [0, 1]
            default: 0
            x-field-mutability: immutable
          content:
            type: string
            description: Server-issued JWT registration credential.
            readOnly: true
            x-f5xc-sensitive: true
          site_name:
            type: string
            description: Secure Mesh Site v2 name bound into a JWT token.
            x-field-mutability: immutable
      - pattern: "^token(Get|Global)SpecType$"
        inject_properties:
          type:
            type: integer
            format: int32
            description: Token type, where 0 is NORMAL and 1 is JWT.
            enum: [0, 1]
            default: 0
            readOnly: true
          content:
            type: string
            description: Server-issued JWT registration credential.
            readOnly: true
            x-f5xc-sensitive: true
          site_name:
            type: string
            description: Secure Mesh Site v2 name bound into a JWT token.
            readOnly: true

  token_cloud_init:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1485"
    description: >-
      Secure Mesh v2 cloud-init contains a one-time site node token. Mark the
      response sensitive and publish it as a generated create-once Terraform
      resource.
    schemas:
      - pattern: "^tokenGetCloudInitConfigResp$"
        inject_extensions:
          x-f5xc-terraform-resource: "xcsh_site_cloud_init"
          x-f5xc-category: "Sites"
          x-f5xc-description-medium: >-
            Site-scoped Customer Edge cloud-init containing a one-time Secure
            Mesh v2 node registration token.
        set_property_extensions:
          cloud_init_config:
            x-f5xc-sensitive: true
            x-f5xc-description-medium: >-
              Complete cloud-init containing the site-scoped one-time node
              token.

  secret_payloads:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1492"
    description: >-
      Secret URL fields carry either Base64 plaintext or a sealed secret
      envelope. Mark both forms sensitive so generated Terraform providers do
      not render credential material in plans or diagnostics.
    schemas:
      - pattern: "^schemaClearSecretInfoType$"
        set_property_extensions:
          url:
            x-f5xc-sensitive: true
      - pattern: "^schemaBlindfoldSecretInfoType$"
        set_property_extensions:
          location:
            x-f5xc-sensitive: true

  registration_approval:
    upstream_issue: "f5-sales-demo/terraform-provider-xcsh#1206"
    description: >-
      registrationApprovalReq lacks a top-level `state` in the upstream swagger,
      and needs an x-f5xc-action marker so downstream codegen emits an
      action-style resource (approve) rather than CRUD.
    schemas:
      - pattern: "^registrationApprovalReq$"
        inject_properties:
          state:
            $ref: "#/components/schemas/registrationObjectState"
        inject_extensions:
          x-f5xc-action: "approve"
        # #1142: passport carries no x-ves-required upstream, yet the API enforces
        # it. Verified live 2026-07-30 against registration
        # r-d2e92964-...-615e9b2daf93 in the f5-sales-demo tenant:
        #
        #   POST /api/register/namespaces/system/registration/{name}/approve
        #     without passport -> 500 "Validation approval: Passport is required"
        #     with passport    -> gets past that check and fails later, on
        #                         "Registration state transition ONLINE to
        #                         APPROVED is forbidden"
        #
        # Presence is what is checked, and it is checked before the state gate: a
        # deliberately wrong passport ({cluster_name: "not-this-site"}) reached the
        # same state error. Whether the VALUE is validated after that gate is not
        # observable on an already-approved registration and remains unmeasured.
        #
        # This absence is why terraform-provider-xcsh#636 failed with a 500 and why
        # that repository carries tools/action-derived-fields.json to read the
        # passport off the object being approved. The workaround exists because the
        # spec did not say the field was required; saying so here is the fix.
        set_property_extensions:
          passport:
            x-ves-required: "true"

  site_upgrade_requests:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1142"
    description: >-
      siteUpgradeSWRequest and siteUpgradeOSRequest mark `force` as
      x-ves-required upstream, but the API does not enforce it. Marking it
      required makes a generator force every caller to state a value for a flag
      whose documented purpose is to override the platform's own safety checks
      ("force upgrade even when logic checks are in place to not allow software
      upgrades, i.e. OS upgrade in progress"). That is the wrong thing to make
      unavoidable.
    schemas:
      - pattern: "^siteUpgrade(SW|OS)Request$"
        # Verified live 2026-07-30 against site cem1-l1. BOTH endpoints were probed:
        # the pattern covers two distinct RPCs, and assuming they validate alike
        # would be exactly the kind of unmeasured extension this issue is about.
        #
        #   POST /api/config/namespaces/system/sites/cem1-l1/upgrade_sw
        #     omitting BOTH force and version -> 400 "version empty in the request"
        #     omitting force only             -> 200
        #   POST /api/config/namespaces/system/sites/cem1-l1/upgrade_os
        #     omitting BOTH force and version -> 400 "version empty in the request"
        #     omitting force only             -> 200
        #
        # Identical on both. The API names `version` and never mentions `force`, so
        # requiredness here is asserted by the marker alone. `namespace` and `name`
        # are path parameters and keep their markers.
        #
        # Not corrected here, and it leaves a contradiction this change does not
        # resolve: x-f5xc-minimum-configuration.required_fields still lists `force`,
        # so the published metadata says optional in one field and required in
        # another. scripts/compile_catalog.py:565 exports that list to the catalog as
        # `requiredFields`, so the contradiction reaches consumers, not just the spec
        # file. It is not patched for these two schemas because the field is derived
        # from "all properties" and ignores requiredness entirely — 12,377 of 14,729
        # schemas are affected, and special-casing two would make #1150 harder to fix
        # rather than easier. Downstream action codegen already declines to consult
        # it, for this exact reason.
        # NEGATED, not removed. The contract-diff gate rejects deleting a key
        # upstream provides — it exists to stop the enriched specs quietly dropping
        # contract data, and removing these four produced 4 violations. Changing the
        # VALUE is classified additive (scripts/utils/additive_allowlist.py), and
        # rightly so: relaxing a requirement cannot break a caller who already sends
        # the field.
        #
        # Negating is better than removing anyway. It leaves the disagreement with F5
        # visible in the artifact — upstream asserts "true", we assert "false" — rather
        # than erasing the evidence that upstream ever said it. Every consumer tests
        # for the string "true" (the provider's convert.go and actionPropIsRequired,
        # and _has_required_validation_rules here), so "false" reads as not-required.
        set_property_extensions:
          force:
            x-ves-required: "false"
        set_property_extension_keys:
          force:
            x-ves-validation-rules:
              ves.io.schema.rules.message.required: "false"
            x-validation-rules:
              ves.io.schema.rules.message.required: "false"

  nested_string_maps:
    upstream_issue: "f5-sales-demo/api-specs-enriched#1391"
    description: >-
      Add explicit string additionalProperties contracts for shared metadata (labels, annotations)
      and other true string maps to establish deterministic value types for downstream codegen.
    schemas:
      - pattern: "^schemaObjectMetaType$"
        set_property_extensions:
          labels:
            additionalProperties:
              type: "string"
          annotations:
            additionalProperties:
              type: "string"
      - pattern: "^network_interfaceStaticIpParametersClusterType$"
        set_property_extensions:
          interface_ip_map:
            additionalProperties:
              type: "string"
      - pattern: "^schemasegmentEdgeData$"
        set_property_extensions:
          dst_labels:
            additionalProperties:
              type: "string"
          src_labels:
            additionalProperties:
              type: "string"
      - pattern: "^tenantLastLoginMap$"
        set_property_extensions:
          last_login_map:
            additionalProperties:
              type: "string"
      - pattern: "^origin_poolOriginServerType$"
        set_property_extensions:
          labels:
            additionalProperties:
              type: "string"

  legacy_contract_removal:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1236"
    description: >-
      Remove pre-production compatibility fields from the provider-facing contract.
      Modern replacements are network policy rules, secret/service policy rule_list,
      explicit header transformation choices, explicit network-interface choices, and
      global_network or site-local virtual-network choices.
    schemas:
      - pattern: "^schemaHeaderTransformationType$"
        remove_properties: [legacy_header_transformation]
        set_property_extensions:
          default_header_transformation:
            description: >-
              Use the platform's current default HTTP header transformation behavior.
          proper_case_header_transformation:
            description: >-
              Transform HTTP header names to proper case when explicit transformation is required.
          preserve_case_header_transformation:
            description: >-
              Preserve HTTP header-name case when upstream case must remain unchanged.
      - pattern: "^network_interface(Get|Replace)SpecType$"
        remove_properties: [legacy_interface]
      - pattern: "^schemanetwork_policy(Get|Replace)SpecType$"
        remove_properties: [legacy_rules]
        set_property_extensions:
          rules:
            description: >-
              Current network-policy ingress and egress rule configuration. Use this field instead
              of the removed compatibility rule container.
      - pattern: "^schemasecret_policy(Get|Replace)SpecType$"
        remove_properties: [legacy_rule_list]
        set_property_extensions:
          rule_list:
            description: >-
              Current secret-policy rule list. Use this field instead of the removed compatibility
              rule list.
      - pattern: "^schemaservice_policy(Get|Replace)SpecType$"
        remove_properties: [legacy_rule_list]
      - pattern: "^virtual_network(Create|Get|Replace)SpecType$"
        remove_properties: [legacy_type]
        set_property_extensions:
          global_network:
            description: >-
              Select the global virtual-network scope for connectivity across participating sites.
          site_local_network:
            description: >-
              Select a site-local virtual network when connectivity must remain within one site.
          site_local_inside_network:
            description: >-
              Select the site-local inside network for site-internal connectivity.

  xcsh_migration_guidance:
    canonical: true
    upstream_issue: "f5-sales-demo/api-specs-enriched#1615"
    description: >-
      Actionable schema guidance for migration behaviors verified by the xcsh issue set
      #3396-#3401 and #3404 without changing enums or wire shapes.
    schemas:
      - pattern: "^schemaservice_policy(Create|Get|Replace)SpecType$"
        set_property_extensions:
          rule_list:
            description: >-
              Ordered service-policy rules for non-geographic predicates and actions. Do not use
              country_list for a geo-only rule here: the platform adds match-all any_ip and any_asn
              selectors on readback, so the rule can match all traffic. Use deny_list or allow_list
              with country_list for geographic source matching.
      - pattern: "^viewshttp_loadbalancer(Create|Get|Replace)SpecType$"
        set_property_extensions:
          rate_limit:
            description: >-
              Load-balancer-wide per-client rate limiting. The counter applies across every path;
              use api_rate_limit rules when only selected paths such as /login should be limited.
          api_rate_limit:
            description: >-
              Path- or API-group-scoped rate limiting. Define server_url_rules or
              api_endpoint_rules and choose inline_rate_limiter for an inline limit, or
              ref_rate_limiter for a stored rate-limiter reference.
      - pattern: "^common_wafAPIRateLimit$"
        set_property_extensions:
          server_url_rules:
            description: >-
              Ordered domain or base-path rules for path-scoped rate limiting. Each rule must choose
              exactly one rate_limiter_choice: inline_rate_limiter or ref_rate_limiter.
          api_endpoint_rules:
            description: >-
              Ordered endpoint-specific rate-limit rules. Each rule must choose exactly one
              rate_limiter_choice: inline_rate_limiter or ref_rate_limiter.
      - pattern: "^common_waf(ServerUrlRule|ApiEndpointRule__.*)$"
        set_property_extensions:
          inline_rate_limiter:
            description: >-
              Inline rate-limiter settings for this domain, base-path, or endpoint rule. Select this
              field as the required rate_limiter_choice when no stored rate-limiter object is used.
          ref_rate_limiter:
            description: >-
              Reference to a stored rate-limiter object for this scoped rule. Select exactly one of
              ref_rate_limiter and inline_rate_limiter.
      - pattern: "^viewsapi_definition(Create|Get|Replace)SpecType$"
        set_property_extensions:
          swagger_specs:
            description: >-
              URLs of versioned OpenAPI files uploaded through Web App & API Protection > Files >
              Swagger Files. The 512-byte item limit is a URL-length limit; inline string:///
              OpenAPI content is rejected and does not create an API-definition object.
      - pattern: "^common_wafOpenApiValidationMode(?:__.*)?$"
        set_property_extensions:
          validation_mode_active:
            description: >-
              Enable OpenAPI validation and explicitly select enforcement_report to allow and log
              invalid traffic, or enforcement_block to reject invalid requests with HTTP 403.
      - pattern: "^common_wafOpenApiValidationModeActive(?:Response)?(?:__.*)?$"
        set_property_extensions:
          enforcement_report:
            description: >-
              Report-only validation: record OpenAPI violations while allowing the request or
              response to continue.
          enforcement_block:
            description: >-
              Blocking validation: reject traffic that violates the selected OpenAPI validation
              properties. Invalid requests are returned as HTTP 403.
      - pattern: "^policyAppFirewallDetectionControl$"
        set_property_extensions:
          exclude_attack_type_contexts:
            description: >-
              Exclude an entire attack type only in the named context. For migrated per-parameter
              exceptions, prefer this over signature-ID exclusions because one payload can trigger
              several signatures; unrelated parameters and attack types remain protected.
      - pattern: "^policyAppFirewallAttackTypeContext$"
        set_property_extensions:
          context:
            description: >-
              Exclusion scope. Use CONTEXT_PARAMETER with context_name for one parameter,
              CONTEXT_COOKIE for one cookie, or CONTEXT_ANY only for an intentionally global scope.
          context_name:
            description: >-
              Parameter, cookie, or header name selected by context. For a parameter-scoped WAF
              exception, set context to CONTEXT_PARAMETER and name only the intended parameter.
          exclude_attack_type:
            description: >-
              Attack-type enum excluded in this context, for example
              ATTACK_TYPE_CROSS_SITE_SCRIPTING. Other attack types remain enforced.
