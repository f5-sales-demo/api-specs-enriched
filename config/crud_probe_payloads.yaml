---
# CRUD probe payloads (machine-tuned). Used by discover_namespace_crud.py
# to reach namespace verdicts past field validation.
address_allocator:
  metadata:
    name: crud-probe
  spec:
    address_allocation_scheme:
      sequential: {}
    address_pool:
      - end_address: 10.0.0.100
        start_address: 10.0.0.2
    mode: LOCAL
authentication:
  metadata:
    name: crud-probe
  spec:
    cookie_params: {}
    oidc_auth:
      client_id: probe
      client_secret:
        clear_secret_info:
          url: string:///dGVzdA==
      issuer: https://issuer.example.com
cdn_loadbalancer:
  metadata:
    name: crud-probe
  spec:
    default_cache_action: {}
    disable_api_definition: {}
    disable_api_discovery: {}
    disable_client_side_defense: {}
    disable_ip_reputation: {}
    disable_malicious_user_detection: {}
    disable_rate_limit: {}
    disable_threat_mesh: {}
    disable_waf: {}
    domains:
      - crud-probe.example.com
    https_auto_cert:
      add_hsts: false
      http_redirect: true
      tls_config:
        default_security: {}
    l7_ddos_action_default: {}
    no_challenge: {}
    no_service_policies: {}
    origin_pool:
      endpoint_selection: LOCAL_PREFERRED
      loadbalancer_algorithm: ROUND_ROBIN
      origin_servers:
        - public_ip:
            ip: 203.0.113.1
      port: 443
      same_as_endpoint_port: {}
      use_tls:
        skip_server_cert_verification: {}
        tls_config:
          default_security: {}
        use_host_header_as_sni: {}
    system_default_timeouts: {}
    user_id_client_ip: {}
certificate:
  metadata:
    name: crud-probe
  spec:
    certificate_url: string:///{CERT_B64}
    private_key:
      clear_secret_info:
        url: string:///{KEY_B64}
certificate_chain:
  metadata:
    name: crud-probe
  spec:
    certificate_url: string:///{CERT_B64}
cloud_credentials:
  metadata:
    name: crud-probe
  spec:
    aws_secret_key:
      access_key: AKIAIOSFODNN7EXAMPLE
      secret_key:
        blindfold_secret_info:
          location: string:///dGVzdA==
cminstance:
  metadata:
    name: crud-probe
  spec:
    api_token:
      clear_secret_info:
        url: string:///dGVzdA==
    ip: 10.0.0.5
    password:
      clear_secret_info:
        url: string:///dGVzdA==
    port: 443
    username: probe
contact:
  metadata:
    name: crud-probe
  spec:
    address1: 1 Test St
    address2: ''
    city: TestCity
    contact_type: MAILING
    country: United States
    county: TestCounty
    phone_number: '+15550199'
    state: California
    state_code: CA
    zip_code: '90210'
container_registry:
  metadata:
    name: crud-probe
  spec:
    password:
      clear_secret_info:
        url: string:///dGVzdHBhc3M=
    server_address: registry.example.com
    user_name: testuser
customer_support:
  metadata:
    name: crud-probe
  spec:
    comments: ''
    description: namespace probe test
    ongoing: false
    product_data:
      product: distributed_cloud
    relates_to: ''
    subject: probe
    timeline: ''
    tp_id: ''
    type: TYPE_QUESTION
data_classification:
  metadata:
    name: crud-probe
  spec:
    rules:
      - data_type_ref:
          name: test
          namespace: shared
ddos_mitigation_rule:
  metadata:
    name: crud-probe
  spec:
    destination_prefix:
      ipv4:
        plen: 8
        prefix: 10.0.0.0
    mitigation_type:
      ip_blocklist: {}
ddos_protection:
  metadata:
    name: crud-probe
  spec:
    protected_entity: {}
dns_domain:
  metadata:
    name: crud-probe-test.example.com
  spec:
    volterra_managed: {}
dns_zone:
  metadata:
    name: crud-probe-zone.example.com
  spec:
    primary: {}
endpoint:
  metadata:
    name: crud-probe
  spec:
    port: 80
    protocol: TCP
    where:
      site:
        name: test
        network_type: VIRTUAL_NETWORK_SITE_LOCAL
external_connector:
  metadata:
    name: crud-probe
  spec:
    ce_site_reference:
      name: dummy
      namespace: system
      tenant: t
    ipsec:
      remote_gateway:
        ipv4:
          addr: 203.0.113.9
fast_acl_rule:
  metadata:
    name: crud-probe
  spec:
    action:
      simple_action: DENY
    prefix:
      - 10.0.0.0/8
fleet_config:
  metadata:
    name: crud-probe
  spec:
    fleet_label: test
k8s_cluster_role:
  metadata:
    name: crud-probe
  spec:
    policy_rule_list:
      policy_rule:
        - resource_list:
            api_groups:
              - ''
            resource_types:
              - pods
            verbs:
              - get
k8s_cluster_role_binding:
  metadata:
    name: crud-probe
  spec:
    k8s_cluster_role:
      name: dummy
      namespace: system
      tenant: t
    subjects:
      - user:
          name: probe
k8s_pod_security_admission:
  metadata:
    name: crud-probe
  spec:
    pod_security_admission_specs:
      - level: privileged
        mode: enforce
nfv_service:
  metadata:
    name: crud-probe
  spec:
    disable_https_management: {}
    disable_ssh_access: {}
    f5_big_ip_aws_service: {}
proxy:
  metadata:
    name: crud-probe
  spec:
    connection_timeout: 2000
    do_not_advertise: {}
    http_proxy: {}
    no_forward_proxy_policy: {}
    no_interception: {}
    site_local_network: {}
rate_limiter_policy:
  metadata:
    name: crud-probe
  spec:
    burst_size: 10
    total_number: 100
    unit: SECOND
registration_token:
  metadata:
    name: crud-probe
  spec:
    infra:
      volterra: {}
    passport:
      cluster_size: 1
report_config:
  metadata:
    name: crud-probe
  spec:
    report_recipients:
      - email: probe@example.com
    waap: {}
service_policy_rule:
  metadata:
    name: crud-probe
  spec:
    action: DENY
    waf_action:
      none: {}
srv6_network_slice:
  metadata:
    name: crud-probe
  spec:
    sid_prefixes:
      - fc00::/32
support_case:
  metadata:
    name: crud-probe
  spec:
    description: Automated namespace CRUD probe - safe to ignore
tcp_loadbalancer:
  _prereqs:
    - path: /api/config/namespaces/{namespace}/origin_pools
      payload:
        metadata:
          name: crud-probe-pool
        spec:
          endpoint_selection: LOCAL_PREFERRED
          loadbalancer_algorithm: ROUND_ROBIN
          origin_servers:
            - public_ip:
                ip: 203.0.113.1
          port: 443
          use_tls:
            skip_server_cert_verification: {}
            tls_config:
              default_security: {}
            use_host_header_as_sni: {}
      type: origin_pool
  metadata:
    name: crud-probe
  spec:
    do_not_advertise: {}
    listen_port: 9443
    origin_pools_weights:
      - pool:
          name: crud-probe-pool
          namespace: '{namespace}'
        weight: 1
threat_category:
  metadata:
    name: crud-probe
  spec:
    tpm_manager_ref:
      - name: test
        namespace: shared
tpm_api_key:
  metadata:
    name: crud-probe
  spec:
    category_ref:
      - name: dummy
        namespace: shared
        tenant: t
    need_mtls: false
tpm_category:
  metadata:
    name: crud-probe
  spec:
    tpm_allow_list: {}
    tpm_manager_ref:
      - name: dummy
        namespace: shared
        tenant: t
usage_report:
  metadata:
    name: crud-probe
  spec: {}
usb_policy:
  metadata:
    name: crud-probe
  spec:
    allowed_devices:
      - product_id: '0x5678'
        vendor_id: '0x1234'
workload:
  metadata:
    name: crud-probe
  spec:
    simple_service:
      container:
        image:
          name: docker.io/library/nginx:latest
          public: {}
        name: main
      do_not_advertise: {}
      no_replicas: {}
      no_volume: {}
workload_flavor:
  metadata:
    name: crud-probe
  spec:
    memory: 4096
    vcpu: 2
