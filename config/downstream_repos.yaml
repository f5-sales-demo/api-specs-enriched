# Downstream Repositories Configuration
# =====================================
# This file defines repositories that should be notified when API specs are updated.
# The upstream workflow (sync-and-enrich.yml) reads this file and dispatches events
# to each enabled repository using GitHub's repository_dispatch mechanism.
#
# To add a new downstream repository:
# 1. Add an entry below with owner, repo, event_type, and enabled fields
# 2. Ensure the downstream repo has a workflow listening for repository_dispatch
#    with the matching event_type
# 3. The DOWNSTREAM_DISPATCH_TOKEN secret must have write access to the repo

---
downstream_repositories:
  # F5 XC Shell (xcsh) - CLI tool for F5 XC
  - owner: f5-sales-demo
    repo: xcsh
    event_type: enriched-specs-updated
    enabled: true
    description: Interactive CLI shell for F5 XC resource management

  # VS Code F5 XC Tools - VS Code extension
  - owner: f5-sales-demo
    repo: vscode-xcsh
    event_type: enriched-specs-updated
    enabled: true
    description: VS Code extension for F5 XC development

  # Terraform Provider F5 XC - Terraform resource provider
  - owner: f5-sales-demo
    repo: terraform-provider-xcsh
    event_type: enriched-specs-updated
    enabled: true
    description: Terraform provider for F5 Distributed Cloud resources

  # Console Catalog - Console UI inventory and browser automation manifests
  - owner: f5-sales-demo
    repo: console
    event_type: upstream-enrichment-changed
    enabled: true
    description: Schema-driven inventory of the F5 XC console UI

# Canonical client_payload sent to downstream repositories (for documentation):
# delivery_id is target-specific: SHA-256 of compact, key-sorted JSON containing
# {commit, event_type, source, tag, target, version}, where target is owner/repo.
# {
#   "delivery_id": "<64-character lowercase SHA-256>",
#   "release_tag": "v2.1.220",
#   "release_url": "https://github.com/f5-sales-demo/api-specs-enriched/releases/tag/v2.1.220",
#   "target_commit": "b3130b919b421a60b3f527c1cea686aebdd59bc3",
#   "trigger_source": "f5-sales-demo/api-specs-enriched",
#   "version": "2.1.220"
# }
