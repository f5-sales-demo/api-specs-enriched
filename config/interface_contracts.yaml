# Evidence-backed interface contracts for resources whose guest interface names
# are not stable configuration identities.
version: "5.0.0"

contracts:
  securemesh_site_v2:
    schema_patterns:
      - "^viewssecuremesh_site_v2(?:Create|Replace|Get)SpecType$"
    contract:
      version: "5.0.0"
      contract_id: "f5xc-ce-automation/v2"
      resource: "securemesh_site_v2"
      api:
        collection_path: "/api/config/namespaces/{namespace}/securemesh_site_v2s"
        item_path: "/api/config/namespaces/{namespace}/securemesh_site_v2s/{name}"
        namespace: "system"
        operations: ["create", "read", "replace", "delete"]
      providers:
        # F5 XC owns SMSv2 configuration and runtime observations. AWS owns
        # cloud resources and TGW Connect addressing. MAC is the only shared
        # interface identity; guest device names are observational only.
        aws:
          availability: "schema_only"
          node_list_path: "aws.not_managed.node_list[]"
          interface_list_path: "aws.not_managed.node_list[].interface_list[]"
          capabilities:
            aws_ce_create: "unavailable"
            runtime_status: "unavailable"
            tgw_connect: "unavailable"
          interface_identity:
            field: "ethernet_interface.mac"
            guest_device: "observational_only"
            known_macs: "non_empty_unique_per_node"
          roles:
            - name: "slo"
              network_option: "site_local_network"
            - name: "sli"
              network_option: "site_local_inside_network"
          telemetry_intake:
            schema_id: "f5xc-smsv2-aws-tgw-telemetry/v1"
            availability: "unavailable"
            required_facts:
              - "runtime"
              - "gre"
              - "bgp"
              - "mtu"
              - "route"
              - "bgp_inside_cidr_block"
            observed_facts:
              - "runtime"
              - "gre"
              - "bgp"
              - "mtu"
              - "route"
              - "bgp_inside_cidr_block"
            unavailable_facts: []
            complete: false
          runtime:
            configuration:
              method: "GET"
              path: "/api/config/namespaces/{namespace}/securemesh_site_v2s/{site}"
              operation_id: "ves.io.schema.views.securemesh_site_v2.API.Get"
              response_schema: "securemesh_site_v2GetResponse"
            health:
              method: "GET"
              path: "/api/operate/namespaces/system/sites/{site}/vpm/debug/global/health"
              operation_id: "ves.io.schema.operate.debug.CustomPublicAPI.HealthPublic"
              response_schema: "debugHealthResponse"
            bgp_peers:
              method: "GET"
              path: "/api/operate/namespaces/{namespace}/sites/{site}/ver/bgp_peers"
              operation_id: "ves.io.schema.operate.bgp.CustomPublicAPI.ShowBGPPeers"
              response_schema: "bgpBGPPeersResponse"
            bgp_routes:
              method: "GET"
              path: "/api/operate/namespaces/{namespace}/sites/{site}/ver/bgp_routes"
              operation_id: "ves.io.schema.operate.bgp.CustomPublicAPI.ShowBGPRoutes"
              response_schema: "bgpBGPRoutesResponse"
            simplified_routes:
              method: "POST"
              path: "/api/operate/namespaces/{namespace}/sites/{site}/ver/simplified_routes"
              operation_id: "ves.io.schema.operate.route.CustomPublicAPI.ShowSimplifiedRoutes"
              request_schema: "routeSimplifiedRouteRequest"
              response_schema: "routeSimplifiedRouteResponse"
          authorities:
            f5xc:
              - "smsv2_configuration"
              - "runtime_health"
              - "bgp_peers"
              - "bgp_routes"
              - "simplified_routes"
            aws:
              - "eni"
              - "transit_gateway"
              - "transit_gateway_connect"
              - "gre_endpoints"
              - "bgp_inside_cidrs"
          prohibited_legacy_apis: ["aws_vpc_site", "aws_tgw_site"]
          bootstrap:
            mode: "interactive_console_only"
            reference: "session_bound_opaque_one_use"
            headless_checkout: "unavailable"
          evidence:
            provenance: "f5-distributed-cloud-smsv2-system-namespace"
            observed_at: "2026-09-02T00:00:00Z"
            profiles: ["aws-shaped-ce-configuration"]
            receipts:
              - operations: ["replace"]
                result: "rejected"
                blocking_conditions:
                  - "mac_only_interface_rejected_by_live_api"
                  - "public_ip_empty_string_null_round_trip"
                sanitized: true
                redaction: "no tenant response, token, bootstrap material, or resource identifier"
          unavailable_capabilities:
            - "aws_ce_create"
            - "runtime_status"
            - "tgw_connect"
        azure:
          availability: "evidence_backed"
          stable_identity:
            required_fields:
              - "node_hostname"
              - "cloud_nic_position"
              - "nic_mac"
              - "ip_configuration"
              - "subnet"
              - "control_plane_interface_reference"
          roles:
            - name: "slo"
              required: true
              bindable: true
              network_option: "site_local_network"
              vrf: "site_local_outside"
              configuration_path: "azure.not_managed.node_list[].interface_list[]"
              identity_fields:
                - "node_hostname"
                - "cloud_nic_position"
                - "nic_mac"
                - "ip_configuration"
                - "subnet"
                - "control_plane_interface_reference"
            - name: "external"
              required: false
              bindable: false
              network_option: null
              vrf: null
              configuration_path: null
              identity_fields:
                - "node_hostname"
                - "cloud_nic_position"
                - "nic_mac"
                - "ip_configuration"
                - "subnet"
                - "control_plane_interface_reference"
            - name: "sli"
              required: false
              bindable: false
              network_option: null
              vrf: null
              configuration_path: null
              identity_fields:
                - "node_hostname"
                - "cloud_nic_position"
                - "nic_mac"
                - "ip_configuration"
                - "subnet"
                - "control_plane_interface_reference"
          invariants:
            first_azure_nic_is_slo_anchor: true
            macs_unique_per_node: true
            role_bindings_unique_per_node: true
            homogeneous_ha_role_vrf_shape: true
            bgp_bindable_roles:
              - "slo"
          runtime_evidence:
            guest_interface_names: "observational_only"
            minimum_mapping_confidence: "authoritative"
            provenance_required: true
            replacement_observation_required: true
          change_risk:
            maintenance_window_required: true
            restarts_ce_data_plane_services: true
            adding_or_removing_interfaces_disruptive: true
