enabled: true
extension_prefix: 'x-f5xc'

# HTTP method base danger levels
danger_levels:
  method_base_levels:
    GET: 'low'
    HEAD: 'low'
    OPTIONS: 'low'
    POST: 'medium'
    PUT: 'medium'
    PATCH: 'medium'
    DELETE: 'high'
    TRACE: 'low'

  # Patterns that escalate danger levels
  escalation_patterns:
    - pattern: 'DELETE.*/namespace$'
      level: 'high'
      reason: 'Deletes entire namespace and contained resources'

    - pattern: 'DELETE.*/(security|firewall|policy|authentication)/'
      level: 'high'
      reason: 'Security-critical deletion'

    - pattern: 'POST.*/(system|global)_'
      level: 'medium'
      reason: 'System-level operation affects tenant-wide configuration'

    - pattern: 'DELETE.*/tenant'
      level: 'high'
      reason: 'Deletes entire tenant'

# Standard fields required for create operations
required_fields:
  standard_create_fields:
    - 'metadata.name'
    - 'metadata.namespace'
  comment: 'F5 XC API standard - applies to POST operations creating resources'

# Side effect determination
side_effects:
  method_effects:
    POST: 'creates'
    PUT: 'modifies'
    PATCH: 'modifies'
    DELETE: 'deletes'

# POST operations that only retrieve data. HTTP method alone is insufficient to
# classify these: each entry is an evidence-backed exception keyed by the exact
# operation identity published by F5.
query_operations:
  ves.io.schema.registration.CustomAPI.GetImageDownloadUrl:
    rationale: Returns signed Customer Edge image URLs without changing tenant state
    required_fields: [provider]
    terraform_name: site_image

# Operations that issue a new credential. These are not reads: consumers must
# persist the first response and must not refresh the operation on every plan.
issuance_operations:
  ves.io.schema.token.CustomAPI.GetCloudInitConfig:
    rationale: Issues site-scoped Customer Edge cloud-init with a one-time node token
    required_fields: [provider, site_name]
    creates: [site_node_token]
    terraform_name: site_cloud_init

# Read-only operations whose response is a typed collection. These contracts
# preserve each API's real path/query/body inputs; the role does not imply a
# synthetic CRUD list route.
collection_operations:
  ves.io.schema.registration.CustomAPI.List:
    rationale: Returns the tenant registration collection
    required_fields: [namespace]
    terraform_name: site_registrations
  ves.io.schema.registration.CustomAPI.ListRegistrationsBySite:
    rationale: Returns registrations selected by site name
    required_fields: [namespace, site_name]
    terraform_name: site_registrations_by_site
  ves.io.schema.registration.CustomAPI.ListRegistrationsByState:
    rationale: Returns registrations selected by lifecycle state
    required_fields: [namespace, state]
    terraform_name: site_registrations_by_state

# One-shot mutations of an existing object. Acceptance means that the platform
# accepted the request; it does not claim asynchronous convergence completed.
action_operations:
  ves.io.schema.site.UpgradeAPI.UpgradeSW:
    rationale: Requests an in-place site software upgrade
    required_fields: [namespace, name, version]
    modifies: [site]
    terraform_name: site_upgrade_sw
  ves.io.schema.site.UpgradeAPI.UpgradeOS:
    rationale: Requests an in-place site operating-system upgrade
    required_fields: [namespace, name, version]
    modifies: [site]
    terraform_name: site_upgrade_os

# Operation Metadata Extensions:
# ===============================
#
# x-f5xc-required-fields (array of strings)
# - List of required field paths for the operation
# - Format: "fieldName" or "parent.child" for nested
# - Example: ["metadata.name", "metadata.namespace", "spec.protocol"]
#
# x-f5xc-optional-fields (array of strings)
# - List of optional but recommended fields
# - Same format as required fields
#
# x-f5xc-danger-level (string)
# - Risk classification: "low" | "medium" | "high"
# - low: Read-only operations (GET, HEAD, OPTIONS)
# - medium: Create/update operations (POST, PUT, PATCH) or system operations
# - high: Destructive operations (DELETE) or security-critical changes
#
# x-f5xc-confirmation-required (boolean)
# - Whether CLI tools should prompt for confirmation
# - Automatically true for danger_level: "high"
#
# x-f5xc-side-effects (object)
# - Documents what the operation creates/modifies/deletes
# - Fields: creates[], modifies[], deletes[] (arrays of resource types)
# - Example: {creates: ["http_loadbalancer"], modifies: [], deletes: []}
#
# Danger Level Algorithm:
# =======================
#
# 1. Start with method base level:
#    - GET/HEAD/OPTIONS → "low"
#    - POST/PUT/PATCH → "medium"
#    - DELETE → "high"
#
# 2. Check escalation patterns:
#    - Match against {METHOD} {PATH}
#    - If match found, return escalated level
#
# 3. Check for dangerous parameters:
#    - If operation has force/cascade flags
#    - Escalate: low→medium, medium→high
#
# 4. Final level is returned
#
# Examples:
# ---------
# GET /api/config/...
#   Base: low → Final: low
#
# DELETE /api/config/.../http_loadbalancers/{name}
#   Base: high → Escalation check: no match → Final: high
#
# DELETE /api/config/.../namespaces/{namespace}
#   Base: high → Escalation: DELETE.*/namespace → Final: high + confirm_required
#
# POST /api/config/.../system_settings
#   Base: medium → Escalation: POST.*/(system|global)_ → Final: medium
#
# Future Enhancement Opportunities:
# ==================================
# - Add custom danger level overrides per operation (operationId)
# - Add templated example generation from OpenAPI examples
# - Add validation rule extraction from requestBody schema
# - Add response code side effect mapping (201=create, 204=delete, etc.)
