name: PR Check

on:
  pull_request:
    branches:
      - main
  # Also trigger on push to version-bump branches to satisfy auto-merge requirements
  # When GITHUB_TOKEN creates a PR, it doesn't trigger pull_request events
  push:
    branches:
      - 'version-bump/**'

# Read-only: the single job just echoes and exits.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR
    runs-on: [self-hosted, Linux, X64, api-specs-enriched, ubuntu-24.04]
    steps:
      - name: PR validation check
        run: |
          echo "✅ PR validation passed"
          exit 0
