---
name: GitHub Pages Deploy
on:
  # Publication owns ordering: GitHub Pages must never advance before the tag
  # and all five release assets have been byte-verified.
  workflow_call:
    inputs:
      target-commit:
        description: 'Exact reconciled release commit to build'
        required: true
        type: string

permissions: {}

concurrency:
  group: pages
  # Queue Pages deployments; never cancel an in-flight deploy. Cancelling mid-
  # deploy leaves the Pages backend with a superseded deployment and the next
  # run fails with "Deployment failed, try again later" (see actions/deploy-pages).
  cancel-in-progress: false

jobs:
  docs:
    uses: f5-sales-demo/docs-control/.github/workflows/github-pages-deploy.yml@58ce2a9b09aa28f6a37b53c6cce445216bc46670
    permissions:
      contents: read # read documentation sources at the verified content ref
      packages: read # pull the pinned fleet documentation builder image
      pages: write # publish the verified Pages artifact
      id-token: write # authenticate the Pages deployment
    with:
      content-ref: ${{ inputs.target-commit }}
      builder-image: ghcr.io/f5-sales-demo/docs-builder@sha256:ba96cff87c091d2f39f6ec9cf94e7036fb2cad58738bb238ff22a71e6d467e92
      socketless_runner_label: managed-socketless
      container_build_runner_label: managed-container-build
