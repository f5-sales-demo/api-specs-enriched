---
name: Workload benchmark

on:
  pull_request:
    types: [labeled, reopened, synchronize]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner class under test
        required: true
        type: choice
        options: [d8-socketless, d16-compute]
      workers:
        description: Independent per-spec workers
        required: true
        type: choice
        options: ['1', '2', '4', '8']
      cache_state:
        description: Dependency cache state
        required: true
        type: choice
        options: [warm, cold]
      variant:
        description: Comparison key (use baseline for the control)
        required: true
        default: baseline
        type: string
      cprofile:
        description: Also retain Python cProfile data
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: workload-benchmark-${{ github.event.pull_request.number || github.run_id }}-${{ inputs.runner || 'pr' }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13.7'

jobs:
  seed:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'autresearch')
    name: Immutable upstream seed
    runs-on: managed-socketless
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Seed specifications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.download --force
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C specs/original -cf - . | gzip -n >"$RUNNER_TEMP/upstream-seed.tar.gz"
          (cd "$RUNNER_TEMP" && sha256sum upstream-seed.tar.gz >upstream-seed.sha256)
      - name: Upload immutable seed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/upstream-seed.tar.gz
            ${{ runner.temp }}/upstream-seed.sha256
          if-no-files-found: error
          retention-days: 30

  benchmark-d8:
    name: D8 ${{ matrix.cache }} w${{ matrix.workers }}
    needs: seed
    runs-on: managed-socketless
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [warm, cold]
        workers: ['1', '2', '4', '8']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python with warm cache
        if: matrix.cache == 'warm'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Setup Python without cache
        if: matrix.cache == 'cold'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        env:
          CACHE_STATE: ${{ matrix.cache }}
        run: |
          if [[ "$CACHE_STATE" == cold ]]; then
            pip install --no-cache-dir -r requirements.txt
          else
            pip install -r requirements.txt
          fi

      - name: Download immutable seed
        uses: actions/download-artifact@18f0e04370a4eeb4808bd3b1f4a34b7c058b18be # v8.0.0
        with:
          name: workload-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed
      - name: Verify immutable seed
        run: cd "$RUNNER_TEMP/seed" && sha256sum --check upstream-seed.sha256
      - name: Run matched D8 pairs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CACHE_STATE: ${{ matrix.cache }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROFILE_DIR: ${{ runner.temp }}/workload-profile
          RUNNER_CLASS: d8
          SEED_ARCHIVE: ${{ runner.temp }}/seed/upstream-seed.tar.gz
          WORKERS: ${{ matrix.workers }}
        run: scripts/run-workload-benchmark.sh
      - name: Upload D8 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-pr-d8-${{ matrix.cache }}-w${{ matrix.workers }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-profile
          if-no-files-found: error
          retention-days: 30

  benchmark-d16:
    name: D16 ${{ matrix.cache }} w${{ matrix.workers }}
    needs: seed
    runs-on: api-specs-enriched-compute
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cache: [warm, cold]
        workers: ['1', '2', '4', '8']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python with warm cache
        if: matrix.cache == 'warm'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Setup Python without cache
        if: matrix.cache == 'cold'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        env:
          CACHE_STATE: ${{ matrix.cache }}
        run: |
          if [[ "$CACHE_STATE" == cold ]]; then
            pip install --no-cache-dir -r requirements.txt
          else
            pip install -r requirements.txt
          fi
      - name: Download immutable seed
        uses: actions/download-artifact@18f0e04370a4eeb4808bd3b1f4a34b7c058b18be # v8.0.0
        with:
          name: workload-seed-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seed
      - name: Verify immutable seed
        run: cd "$RUNNER_TEMP/seed" && sha256sum --check upstream-seed.sha256
      - name: Run matched D16 pairs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CACHE_STATE: ${{ matrix.cache }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROFILE_DIR: ${{ runner.temp }}/workload-profile
          RUNNER_CLASS: d16
          SEED_ARCHIVE: ${{ runner.temp }}/seed/upstream-seed.tar.gz
          WORKERS: ${{ matrix.workers }}
        run: scripts/run-workload-benchmark.sh
      - name: Upload D16 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-pr-d16-${{ matrix.cache }}-w${{ matrix.workers }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-profile
          if-no-files-found: error
          retention-days: 30

  collect:
    name: Evidence gate
    needs: [benchmark-d8, benchmark-d16]
    runs-on: managed-socketless
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download workload profiles
        uses: actions/download-artifact@18f0e04370a4eeb4808bd3b1f4a34b7c058b18be # v8.0.0
        with:
          pattern: workload-profile-pr-*
          path: ${{ runner.temp }}/profiles
          merge-multiple: true
      - name: Evaluate acceptance gates
        run: |
          mapfile -d '' profiles < <(find "$RUNNER_TEMP/profiles" -type f -name '*.json' ! -name 'evidence-*' ! -name 'pytest-evidence-*' -print0)
          python -m scripts.workload_evidence gate "${profiles[@]}" --output "$RUNNER_TEMP/workload-gate.json"
          jq . "$RUNNER_TEMP/workload-gate.json" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload gate result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-gate.json
          if-no-files-found: error
          retention-days: 30

  manual-d8:
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'd8-socketless'
    name: Manual D8 profile
    runs-on: managed-socketless
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install and seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pip install -r requirements.txt && python -m scripts.download --force
      - name: Profile selected configuration
        env:
          CACHE_STATE: ${{ inputs.cache_state }}
          VARIANT: ${{ inputs.variant }}
          WORKERS: ${{ inputs.workers }}
        run: |
          [[ "$VARIANT" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          mkdir -p "$RUNNER_TEMP/workload-profile"
          runner-profile --name enrichment-pipeline --output "$RUNNER_TEMP/workload-profile/pipeline.json" --cache-state "$CACHE_STATE" --variant "$VARIANT" -- python -m scripts.pipeline --workers "$WORKERS"
          python -m scripts.workload_evidence evidence --tree docs/specifications/api --archive "$RUNNER_TEMP/workload-profile/archive.zip" --output "$RUNNER_TEMP/workload-profile/evidence.json"
          python -m scripts.workload_evidence enrich-profile --profile "$RUNNER_TEMP/workload-profile/pipeline.json" --evidence "$RUNNER_TEMP/workload-profile/evidence.json" --memory reports/memory-profile.json
      - name: Capture single-process cProfile
        if: inputs.cprofile
        run: mkdir -p "$RUNNER_TEMP/cprofile" && python -m cProfile -o "$RUNNER_TEMP/cprofile/pipeline.pstats" -m scripts.pipeline --workers 1
      - name: Upload manual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-manual-d8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-profile
          if-no-files-found: error
          retention-days: 30
      - name: Upload manual cProfile data
        if: inputs.cprofile && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cprofile-manual-d8-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cprofile/pipeline.pstats
          if-no-files-found: error
          retention-days: 7

  manual-d16:
    if: github.event_name == 'workflow_dispatch' && inputs.runner == 'd16-compute'
    name: Manual D16 profile
    runs-on: api-specs-enriched-compute
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install and seed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pip install -r requirements.txt && python -m scripts.download --force
      - name: Profile selected configuration
        env:
          CACHE_STATE: ${{ inputs.cache_state }}
          VARIANT: ${{ inputs.variant }}
          WORKERS: ${{ inputs.workers }}
        run: |
          [[ "$VARIANT" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          mkdir -p "$RUNNER_TEMP/workload-profile"
          runner-profile --name enrichment-pipeline --output "$RUNNER_TEMP/workload-profile/pipeline.json" --cache-state "$CACHE_STATE" --variant "$VARIANT" -- python -m scripts.pipeline --workers "$WORKERS"
          python -m scripts.workload_evidence evidence --tree docs/specifications/api --archive "$RUNNER_TEMP/workload-profile/archive.zip" --output "$RUNNER_TEMP/workload-profile/evidence.json"
          python -m scripts.workload_evidence enrich-profile --profile "$RUNNER_TEMP/workload-profile/pipeline.json" --evidence "$RUNNER_TEMP/workload-profile/evidence.json" --memory reports/memory-profile.json
      - name: Capture single-process cProfile
        if: inputs.cprofile
        run: mkdir -p "$RUNNER_TEMP/cprofile" && python -m cProfile -o "$RUNNER_TEMP/cprofile/pipeline.pstats" -m scripts.pipeline --workers 1
      - name: Upload manual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-manual-d16-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-profile
          if-no-files-found: error
          retention-days: 30
      - name: Upload manual cProfile data
        if: inputs.cprofile && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cprofile-manual-d16-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cprofile/pipeline.pstats
          if-no-files-found: error
          retention-days: 7
