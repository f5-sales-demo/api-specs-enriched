---
name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Exact version pre-populated in the immutable runner tool cache.
  PYTHON_VERSION: '3.13.7'

jobs:
  pytest:
    name: Run pytest suite
    # Fork pull requests must never receive a repository self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, api-specs-enriched, ubuntu-24.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # verify_governance needs base..head diff

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify no governed files touched
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          python -m scripts.verify_governance --base "origin/$BASE_REF" --head HEAD

      - name: Seed specs/original/ from upstream releases
        # Pulls the latest f5-sales-demo/api-specs release into
        # specs/original/ so spec-dependent test modules (currently
        # only tests/test_all_endpoints_enrichment.py) execute instead
        # of skipping at import time.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.download --force

      - name: Run pytest
        run: python -m pytest

  contract-diff:
    name: Contract-diff gate
    needs: pytest
    # Release PRs ship the pipeline's regenerated docs — they are
    # snapshots, not contract-drifting changes. Skipping here avoids
    # a spurious gate failure from the "Seed specs/original/ from
    # upstream" step which can't resolve inputs on release branches.
    # Fork pull requests are excluded before a self-hosted runner is allocated.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !startsWith(github.head_ref, 'release/')
    runs-on: [self-hosted, Linux, X64, api-specs-enriched, ubuntu-24.04]
    permissions:
      contents: read
      pull-requests: write # Comment when the contract-diff gate detects a change.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed specs/original/ from upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --force: .etag tracks version but specs/original/ is gitignored
        # and absent in CI. Without --force, download skips with 'No updates'.
        run: python -m scripts.download --force

      - name: Run enrichment pipeline
        # Override Makefile's PYTHON=.venv/bin/python since CI installs
        # deps into the system Python via setup-python + pip install.
        # API_SPECS_SKIP_BIOME=1 — the pipeline would otherwise reformat
        # generated JSON via `biome format --write`, which is only
        # cosmetic and not installed in this job. The contract-diff gate
        # compares semantic shape (deepdiff with ignore_order=True), so
        # JSON formatting does not affect the outcome. The sync-and-
        # enrich workflow installs and pins biome for the release path.
        env:
          API_SPECS_SKIP_BIOME: "1"
        run: make pipeline PYTHON=python

      # #1152: the pipeline just rebuilt every spec from the freshly downloaded
      # upstream seed, so this is the cheapest possible place to answer "is the
      # committed tree what the pipeline produces?" — a question that had no answer
      # while 43 files carried a per-run wall-clock timestamp.
      #
      # It matters because an unanswerable version of this question is how a stale
      # local seed came to silently revert the upstream misspelled-`persistence`
      # rename that the F5 server depends on (api-specs#686 — emitting the corrected
      # spelling makes F5 discard the field), and how index.json came to report
      # 2.1.200 while namespace_profiles.json reported 2.1.199.
      #
      # Two consecutive local rebuilds were verified byte-identical before this step
      # was added, so a diff here means the committed tree is stale — never that the
      # pipeline is nondeterministic.
      #
      # Compared semantically, not byte-wise: this job runs with
      # API_SPECS_SKIP_BIOME=1, so its JSON formatting differs from the committed
      # (biome-formatted) tree. Installing biome here to allow a byte comparison is
      # the better check and is the follow-up; parsed-equality already catches
      # content drift, which is what reverted the rename.
      - name: Verify the committed specs match a clean rebuild
        run: |
          python - <<'EOF'
          import json, pathlib, subprocess, sys

          # The repo's own release version is stamped into every spec — `info.version`
          # in each domain file and a top-level `version` in the index. It comes from
          # `git describe --tags`, so it is a property of the BUILD, not of the content:
          #
          #   * this job checks out shallow and without tags, so `git describe` fails
          #     and the version becomes the "0.0.0" fallback, while a developer's tree
          #     carries a real tag — all 41 files then differ on that field alone;
          #   * a release is cut on every merge, so even with tags fetched, the value
          #     advances and the committed tree would go stale the instant a release
          #     lands, failing the NEXT pull request for something it did not do.
          #
          # This check exists to catch CONTENT drift — the stale seed that silently
          # reverted the upstream misspelled-`persistence` rename the F5 server depends
          # on (api-specs#686). So compare content and normalise the build identity out.
          # validation.json is not an OpenAPI document — it is a self-describing
          # artifact carrying its own `$schema` and its own format version (2.1.0,
          # against the repo's 2.1.201). That version is content, not build identity,
          # so leave it alone.
          def carries_build_version(doc):
              return isinstance(doc, dict) and "$schema" not in doc

          def strip_build_identity(doc):
              if not carries_build_version(doc):
                  return doc
              doc = dict(doc)
              doc.pop("version", None)
              info = doc.get("info")
              if isinstance(info, dict):
                  info = dict(info)
                  info.pop("version", None)
                  doc["info"] = info
              return doc

          spec_dir = pathlib.Path("docs/specifications/api")
          drifted = []
          rebuilt_versions = {}
          for path in sorted(spec_dir.glob("*.json")):
              committed = subprocess.run(
                  ["git", "show", f"HEAD:{path}"],
                  capture_output=True, text=True, check=False,
              )
              if committed.returncode != 0:
                  drifted.append(f"{path} (not in HEAD)")
                  continue
              try:
                  rebuilt = json.loads(path.read_text())
                  if strip_build_identity(json.loads(committed.stdout)) != strip_build_identity(rebuilt):
                      drifted.append(str(path))
              except json.JSONDecodeError as exc:
                  drifted.append(f"{path} (unparseable: {exc})")
                  continue
              if carries_build_version(rebuilt):
                  stamped = rebuilt.get("version") or (rebuilt.get("info") or {}).get("version")
                  if stamped:
                      rebuilt_versions.setdefault(str(stamped), []).append(path.name)

          if drifted:
              print("::error::The committed specs differ from a clean rebuild.")
              print("Run `make download-force && make pipeline` and commit the result.")
              print("Files that differ:")
              for name in drifted:
                  print(f"  - {name}")
              sys.exit(1)

          # The version is not compared against the committed tree, but it must still be
          # CONSISTENT across a single build. Skew is a real defect this repo has had:
          # index.json reported 2.1.200 while namespace_profiles.json reported 2.1.199.
          if len(rebuilt_versions) > 1:
              print("::error::One rebuild produced more than one version stamp.")
              for value, files in sorted(rebuilt_versions.items()):
                  print(f"  {value}: {len(files)} file(s), e.g. {files[0]}")
              sys.exit(1)

          print(f"All {len(list(spec_dir.glob('*.json')))} specs match a clean rebuild.")
          print(f"Single consistent version stamp: {next(iter(rebuilt_versions), 'none')}")
          EOF

      - name: Run contract-diff gate
        id: contract_diff
        run: |
          mkdir -p reports
          python -m scripts.contract_diff \
            --input specs/original \
            --output docs/specifications/api \
            --report reports/contract_diff.json \
            --markdown reports/contract_diff.md

      - name: Upload contract-diff artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-diff
          path: reports/contract_diff.*
          retention-days: 14

      - name: Post violations to PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true  # 64KB body cap is still possible
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/contract_diff.md';
            if (!fs.existsSync(path)) {
              core.warning(`No ${path} to post; the gate failed before producing a report.`);
              return;
            }
            const md = fs.readFileSync(path, 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const banner = '> **Contract-diff gate violation.** ' +
              `Full report: [contract-diff artifact](${runUrl}#artifacts) ` +
              '(this comment may be truncated).\n\n';
            // GitHub caps issue-comment bodies at 65536 chars. Leave
            // headroom for the banner and a truncation marker.
            const CAP = 65000;
            const bodyAvailable = CAP - banner.length - 200;
            const truncated = md.length > bodyAvailable;
            const report = truncated
              ? md.slice(0, bodyAvailable) +
                `\n\n*…truncated. ${md.length - bodyAvailable} more chars; see artifact.*`
              : md;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: banner + report,
            });
