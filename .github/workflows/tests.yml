---
name: Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUILDER_IMAGE: python:3.13.14-bookworm@sha256:353cf2106d143e1d28f5d7c10c5f5c0387085bba22ef0f7f7e52c2c330fb1779
  PYTHON_VERSION: '3.13.14'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  TZ: UTC
  LC_ALL: C
  LANG: C

jobs:
  pytest:
    name: Run pytest suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # verify_governance needs base..head diff

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup frozen Python package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify no governed files touched
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=50
          python -m scripts.verify_governance --base "origin/$BASE_REF" --head HEAD

      - name: Verify generated-output ownership
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          bash scripts/release/verify-generated-ownership.sh \
            --base "origin/$BASE_REF" \
            --head HEAD \
            --branch "$HEAD_REF"

      - name: Seed specs/original/ from upstream releases
        # Pulls the latest f5-sales-demo/api-specs release into
        # specs/original/ so spec-dependent test modules (currently
        # only tests/test_all_endpoints_enrichment.py) execute instead
        # of skipping at import time.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.download --force

      - name: Run pytest
        run: python -m pytest

  contract-diff:
    name: Contract-diff gate
    needs: pytest
    # Every PR, including the exact semantic release PR, independently rebuilds
    # and verifies the candidate. Producer success is not a substitute for the
    # required merge gate on the bytes that will actually enter main.
    runs-on: ubuntu-latest
    container:
      image: python:3.13.14-bookworm@sha256:353cf2106d143e1d28f5d7c10c5f5c0387085bba22ef0f7f7e52c2c330fb1779
    permissions:
      contents: read
      pull-requests: write # publish the contract-diff report on the pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup frozen Python package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.5.6

      - name: Setup Node.js for Spectral
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked Spectral CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Seed specs/original/ from upstream releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # specs/original/ is gitignored and absent in CI. Force a fresh download
        # and digest verification even when .github_release is already tracked.
        run: python -m scripts.download --force

      - name: Build release twice and verify byte reproducibility
        # Source/config PRs must prove that one frozen input and formatter
        # produce byte-identical release output before semantic contract diff.
        run: |
          set -euo pipefail
          version=$(python -m scripts.utils.version_calculator)
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/api-specs-build-env-1" \
            uv sync --frozen --no-cache
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/api-specs-build-env-2" \
            uv sync --frozen --no-cache
          verify_args=(
            --version "$version"
            --input-dir specs/original
            --first-root "$RUNNER_TEMP/api-specs-candidate"
            --second-root "$RUNNER_TEMP/api-specs-rebuild"
            --first-python "$RUNNER_TEMP/api-specs-build-env-1/bin/python"
            --second-python "$RUNNER_TEMP/api-specs-build-env-2/bin/python"
            --manifest "$RUNNER_TEMP/reproducibility-manifest.json"
          )
          if [[ "$HEAD_REF" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            verify_args+=(--committed-root "$GITHUB_WORKSPACE")
          elif [[ "$HEAD_REF" == release/* ]]; then
            echo "::error::Release branch is not an exact semantic release branch: $HEAD_REF"
            exit 1
          fi
          python -m scripts.release.verify_reproducible_build "${verify_args[@]}"
        env:
          HEAD_REF: ${{ github.head_ref }}

      - name: Lint isolated release candidate
        run: >-
          python scripts/lint.py
          --input-dir "$RUNNER_TEMP/api-specs-candidate/docs/specifications/api"
          --fail-on-error
          --fail-on-warning

      - name: Verify extension registry against isolated release candidate
        env:
          API_SPECS_ENRICHED_DIR: ${{ runner.temp }}/api-specs-candidate/docs/specifications/api
        run: python -m pytest --no-cov -q tests/candidate_extension_registry.py

      - name: Run contract-diff gate
        id: contract_diff
        run: |
          mkdir -p reports
          python -m scripts.contract_diff \
            --input specs/original \
            --output "$RUNNER_TEMP/api-specs-candidate/docs/specifications/api" \
            --report reports/contract_diff.json \
            --markdown reports/contract_diff.md

      - name: Upload contract-diff artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-diff
          path: |
            reports/contract_diff.*
            ${{ runner.temp }}/reproducibility-manifest.json
          retention-days: 14

      - name: Post violations to PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true  # 64KB body cap is still possible
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = 'reports/contract_diff.md';
            if (!fs.existsSync(path)) {
              core.warning(`No ${path} to post; the gate failed before producing a report.`);
              return;
            }
            const md = fs.readFileSync(path, 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const banner = '> **Contract-diff gate violation.** ' +
              `Full report: [contract-diff artifact](${runUrl}#artifacts) ` +
              '(this comment may be truncated).\n\n';
            // GitHub caps issue-comment bodies at 65536 chars. Leave
            // headroom for the banner and a truncation marker.
            const CAP = 65000;
            const bodyAvailable = CAP - banner.length - 200;
            const truncated = md.length > bodyAvailable;
            const report = truncated
              ? md.slice(0, bodyAvailable) +
                `\n\n*…truncated. ${md.length - bodyAvailable} more chars; see artifact.*`
              : md;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: banner + report,
            });
