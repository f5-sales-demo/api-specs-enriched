---
name: Sync and Enrich API Specs

on:
  # Primary path: f5-sales-demo/api-specs sends this the moment a spec release
  # publishes, so a correction is consumed in minutes instead of waiting for the
  # cron below. See f5-sales-demo/api-specs#693.
  repository_dispatch:
    types: [upstream-specs-released]
  schedule:
    # Safety net, not the primary path: catches an upstream release whose
    # dispatch never arrived (token expiry, an api-specs run that died after
    # publishing, a hand-cut release).
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'release/README.md'
      - '.github/workflows/sync-and-enrich.yml'
      - 'docs/**/*.html'
  workflow_dispatch:

# Read-only default. Release-branch pushes and pull-request operations authenticate
# with VERSION_BUMP_PAT. Tagging, asset publication, Pages, and downstream dispatch
# are owned by publish-release.yml after the release PR has merged.
permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDER_IMAGE: python:3.13.14-bookworm@sha256:353cf2106d143e1d28f5d7c10c5f5c0387085bba22ef0f7f7e52c2c330fb1779
  PYTHON_VERSION: '3.13.14'
  PYTHONHASHSEED: '0'
  PYTHONUTF8: '1'
  TZ: UTC
  LC_ALL: C
  LANG: C

jobs:
  check-updates:
    name: Check for Updates
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.updated }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup frozen Python package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Pin the exact upstream release event
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          PINNED_RECEIPT: ${{ runner.temp }}/api-specs-release-receipt.json
          REPOSITORY: ${{ github.repository }}
          # The safety-net dispatch is a repository write and therefore uses the
          # existing cross-workflow PAT. The actual release read is exact-tag-only.
          GH_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          GITHUB_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.release.upstream_receipt import require_receipt_progression
          from scripts.utils.github_release import (
              load_release_receipt,
              validate_release_receipt,
              write_release_receipt,
          )

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          payload = event.get("client_payload")
          if not isinstance(payload, dict):
              raise ValueError("repository_dispatch client_payload must be an object")
          if payload.get("trigger_source") != "f5-sales-demo/api-specs":
              raise ValueError("repository_dispatch trigger_source is not f5-sales-demo/api-specs")
          receipt = require_receipt_progression(
              load_release_receipt(Path(".github_release")),
              validate_release_receipt(payload.get("release_receipt")),
          )
          write_release_receipt(Path(os.environ["PINNED_RECEIPT"]), receipt)
          print(f"Pinned upstream event {json.dumps(receipt['tag_name'])}")
          PY
            echo "updated=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            python - <<'PY'
          from pathlib import Path

          from scripts.utils.github_release import load_release_receipt

          load_release_receipt(Path(".github_release"))
          PY
            echo "updated=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Discovery of "latest" is isolated here. It creates a new pinned
            # repository_dispatch event; this run never consumes mutable latest.
            python -m scripts.download --resolve-latest-receipt "$PINNED_RECEIPT"
            jq -n --slurpfile receipt "$PINNED_RECEIPT" \
              '{event_type:"upstream-specs-released",client_payload:{trigger_source:"f5-sales-demo/api-specs",release_receipt:$receipt[0]}}' \
              > "$RUNNER_TEMP/pinned-upstream-event.json"
            gh api --method POST "repos/${REPOSITORY}/dispatches" \
              --input "$RUNNER_TEMP/pinned-upstream-event.json"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Created a pinned upstream release event; this discovery run will not build"
          else
            echo "::error::Unsupported event: $EVENT_NAME"
            exit 1
          fi

  sync-and-enrich:
    name: Sync and Enrich Specifications
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    container:
      image: python:3.13.14-bookworm@sha256:353cf2106d143e1d28f5d7c10c5f5c0387085bba22ef0f7f7e52c2c330fb1779
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0  # Full history needed for git describe --tags
          fetch-tags: true  # Explicitly fetch tags for version calculation
          token: ${{ secrets.VERSION_BUMP_PAT }}  # Use admin PAT for bypass permissions

      - name: Install exact workflow CLIs
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gh.tar.gz \
            https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz
          echo "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  /tmp/gh.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gh.tar.gz --directory /tmp
          install -m 0755 /tmp/gh_2.97.0_linux_amd64/bin/gh /usr/local/bin/gh
          curl --fail --silent --show-error --location \
            --output /tmp/jq \
            https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  /tmp/jq" \
            | sha256sum --check --strict
          install -m 0755 /tmp/jq /usr/local/bin/jq

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup frozen Python package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Download the exact pinned api-specs release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED_RECEIPT: ${{ runner.temp }}/api-specs-release-receipt.json
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.release.upstream_receipt import require_receipt_progression
          from scripts.utils.github_release import (
              load_release_receipt,
              validate_release_receipt,
              write_release_receipt,
          )

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          payload = event.get("client_payload")
          if not isinstance(payload, dict):
              raise ValueError("repository_dispatch client_payload must be an object")
          if payload.get("trigger_source") != "f5-sales-demo/api-specs":
              raise ValueError("repository_dispatch trigger_source is not f5-sales-demo/api-specs")
          receipt = require_receipt_progression(
              load_release_receipt(Path(".github_release")),
              validate_release_receipt(payload.get("release_receipt")),
          )
          write_release_receipt(Path(os.environ["PINNED_RECEIPT"]), receipt)
          PY
          elif [ "$EVENT_NAME" = "push" ]; then
            cp .github_release "$PINNED_RECEIPT"
          else
            echo "::error::Production build requires a push or pinned repository_dispatch event"
            exit 1
          fi
          python -m scripts.download --receipt "$PINNED_RECEIPT" --force

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51  # v2.7.1 — matches docs-control super-linter.yml
        with:
          version: 2.5.6

      - name: Setup Node.js for Spectral
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked Spectral CLI
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Resolve committed build version
        id: build-version
        run: echo "version=$(python -m scripts.utils.version_calculator)" >> "$GITHUB_OUTPUT"

      - name: Build current-version candidate with the canonical entry point
        env:
          BUILD_VERSION: ${{ steps.build-version.outputs.version }}
        run: >-
          python -m scripts.release.build_release_tree
          --version "$BUILD_VERSION"
          --root .
          --input-dir specs/original
          --biome biome

      - name: Lint specifications with Spectral
        run: python scripts/lint.py --input-dir docs/specifications/api --fail-on-error --fail-on-warning

      - name: Validate specifications
        id: validation
        env:
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
        run: |
          mkdir -p reports
          set +e
          python -m scripts.validate 2>&1 | tee reports/validation-console.log
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Sanitize validation evidence
        id: sanitize_evidence
        if: always()
        env:
          F5XC_API_TOKEN: ${{ secrets.F5XC_API_TOKEN }}
          F5XC_API_URL: ${{ secrets.F5XC_API_URL }}
        run: >-
          python -m scripts.sanitize_validation_evidence
          --required reports/validation-console.log
          --output-dir reports/sanitized-validation-evidence
          reports/validation-report.json reports/validation-report.md

      - name: Upload validation evidence
        if: always() && steps.sanitize_evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-evidence
          path: reports/sanitized-validation-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation result
        if: always()
        env:
          VALIDATION_STATUS: ${{ steps.validation.outputs.status }}
        run: |
          if ! [[ "$VALIDATION_STATUS" =~ ^[0-9]+$ ]]; then
            echo "::error::Validation did not produce an exit status"
            exit 1
          fi
          exit "$VALIDATION_STATUS"

      - name: Detect release-worthy changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETECT_RELEASE_BASE: >-
            ${{ github.event_name == 'push' && github.event.before || github.sha }}
        # Output-driven gate: compares the generated, tracked output in the
        # working tree against this trigger's immutable base. Lives in a script so it can be unit
        # tested (tests/shell/test_detect_release_changes.py) — the inline
        # block it replaces was untestable, which is how #1094 survived.
        run: bash scripts/release/detect-release-changes.sh

      - name: Bump version
        id: version
        if: steps.detect.outputs.has_changes == 'true'
        env:
          CHANGE_TYPE: ${{ steps.detect.outputs.change_type }}
        run: |
          # A tag is a publication receipt and can lag the committed artifact
          # after a recoverable publication interruption. Allocate from the
          # greater identity so a missing tag can never reuse an existing
          # committed version.
          TAG_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          CURRENT_VERSION=$(python -m scripts.utils.version_calculator --max-with "$TAG_VERSION")

          echo "✅ Current committed/tag version: $CURRENT_VERSION"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Check for major bump via commit message (highest priority)
          # For merge commits, also check the commits that were merged (HEAD^2)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          MERGED_MSG=""
          if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
            MERGED_MSG=$(git log -1 HEAD^2 --pretty=%B)
          fi
          COMBINED_MSG="$COMMIT_MSG $MERGED_MSG"

          if [[ "$COMBINED_MSG" == *"[major]"* ]] || \
            [[ "$COMBINED_MSG" == *"BREAKING CHANGE"* ]]; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
            BUMP_TYPE="major"
          elif [ "$CHANGE_TYPE" = "source" ]; then
            # Source spec changes → check for new domains (minor) or patch
            PREV_COUNT=$(git show HEAD:docs/specifications/api/index.json | \
              jq -er '.specifications | if type == "array" then length else error("invalid specifications") end')
            CURR_COUNT=$(jq -er \
              '.specifications | if type == "array" then length else error("invalid specifications") end' \
              docs/specifications/api/index.json)

            if [ "$CURR_COUNT" -gt "$PREV_COUNT" ]; then
              NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
              BUMP_TYPE="minor"
            else
              NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              BUMP_TYPE="patch"
            fi
          elif [ "$CHANGE_TYPE" = "pipeline" ]; then
            # Pipeline/config/dependency changes → patch bump
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            BUMP_TYPE="patch"
            echo "::notice::Pipeline changes detected - patch bump"
          else
            echo "::error::Unsupported change type: $CHANGE_TYPE"
            exit 1
          fi

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump_type=$BUMP_TYPE" >> "$GITHUB_OUTPUT"

          echo "::notice::Version: $CURRENT_VERSION -> $NEW_VERSION ($BUMP_TYPE)"

      - name: Rebuild exact release version with the canonical entry point
        if: steps.detect.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: >-
          python -m scripts.release.build_release_tree
          --version "$VERSION"
          --root .
          --input-dir specs/original
          --biome biome

      - name: Generate changelog
        if: steps.detect.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
        run: |
          # Changelog content must be a function of the release input, not the
          # date a retry happens to run.
          DATE=$(jq -er '.published_at[0:10]' .github_release)

          # `.github_release` is the validated upstream receipt. The generated
          # index deliberately contains only this repository's build identity.
          UPSTREAM_VERSION=$(jq -er '.version' .github_release)
          UPSTREAM_TAG=$(jq -er '.tag_name' .github_release)
          UPSTREAM_PUBLISHED_AT=$(jq -er '.published_at' .github_release)
          UPSTREAM_ASSET=$(jq -er '.asset_name' .github_release)
          UPSTREAM_DIGEST=$(jq -er '.asset_digest' .github_release)
          FULL_VERSION=$(jq -er '.version' docs/specifications/api/index.json)

          # Preserve existing changelog entries (prepend-only strategy to avoid merge conflicts)
          EXISTING_ENTRIES=""
          if [ -f CHANGELOG.md ]; then
            # Preserve every prior release entry while replacing only the title.
            EXISTING_ENTRIES=$(sed -n '/^## Version /,$p' CHANGELOG.md)
          fi

          # Calculate statistics
          if [ ! -d specs/original ]; then
            echo "::error::Downloaded source specification directory is missing"
            exit 1
          fi
          ORIG_SPECS=$(find specs/original -name '*.json' -type f | wc -l | xargs)
          DOMAIN_COUNT=$(jq -er '.specifications | if type == "array" then length else error("invalid specifications") end' docs/specifications/api/index.json)
          PATH_COUNT=$(jq -er '[.specifications[].path_count] | add' docs/specifications/api/index.json)
          SCHEMA_COUNT=$(jq -er '[.specifications[].schema_count] | add' docs/specifications/api/index.json)

          # Write changelog directly to avoid heredoc YAML parsing issues
          {
            echo "# Changelog"
            echo ""
            echo "## Version $FULL_VERSION ($DATE)"
            echo ""
            echo "### Version Information"
            echo "- **Full Version**: $FULL_VERSION"
            echo "- **Upstream Version**: $UPSTREAM_VERSION"
            echo "- **Upstream Tag**: $UPSTREAM_TAG"
            echo "- **Upstream Published At**: $UPSTREAM_PUBLISHED_AT"
            echo "- **Upstream Asset**: $UPSTREAM_ASSET"
            echo "- **Upstream SHA-256**: $UPSTREAM_DIGEST"
            echo ""
            echo "### Release Type"
            echo "- **$BUMP_TYPE** release"
            echo ""
            echo "### Changes"
            echo "- Consumed corrected API specifications from f5-sales-demo/api-specs release $UPSTREAM_TAG"
            echo "- Applied enrichment pipeline:"
            echo "  - Acronym normalization (100+ terms)"
            echo "  - Grammar improvements"
            echo "  - Branding updates (Volterra → F5 Distributed Cloud)"
            echo "- Applied normalization pipeline:"
            echo "  - Rejected invalid source graphs instead of fabricating missing contracts"
            echo "  - Canonicalized shared components deterministically"
            echo "  - Type standardization"
            echo "- Validated with Spectral OpenAPI linter"
            echo "- Merged specifications by domain"
            echo ""
            echo "### Statistics"
            echo "- Original specs: $ORIG_SPECS"
            echo "- Domains: $DOMAIN_COUNT"
            echo "- Total paths: $PATH_COUNT"
            echo "- Total schemas: $SCHEMA_COUNT"

            echo ""
            echo "### Output Structure"
            echo "\\\`\\\`\\\`text"
            echo "docs/specifications/api/"
            echo "├── [domain].json        # Domain-specific specs"
            echo "├── openapi.json         # Master combined spec"
            echo "└── index.json           # Metadata index"
            echo "\\\`\\\`\\\`"
            echo ""
            echo "### Download"
            echo "- ZIP Package: f5xc-api-specs-v${VERSION}.zip"
            echo ""
            echo "### Source"
            echo "- Corrected source: f5-sales-demo/api-specs immutable release asset"
            echo "- Receipt: $UPSTREAM_TAG ($UPSTREAM_ASSET, $UPSTREAM_DIGEST)"
            echo ""

            # Append existing entries
            if [ -n "$EXISTING_ENTRIES" ]; then
              echo "$EXISTING_ENTRIES"
            fi
          } > CHANGELOG.md

      - name: Commit and tag release
        if: steps.detect.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          VERSION: ${{ steps.version.outputs.new_version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Configure git to use VERSION_BUMP_PAT for authentication
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          BRANCH="release/v${VERSION}"

          # Stage enriched outputs
          # Use -f for ignored generated trees; list the tracked plugin config
          # explicitly so every output of generate_api_viewer is promoted.
          git add -f \
            CHANGELOG.md \
            .github_release \
            release/api-catalog.json \
            docs/specifications/api/ \
            docs/api-reference/ \
            docs/openapi-specs-config.json

          if ! git diff --staged --quiet; then
            EXISTING_PR=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
            if [ -n "$EXISTING_PR" ]; then
              git fetch origin "$BRANCH"
              if ! git diff --cached --quiet "origin/${BRANCH}" -- \
                CHANGELOG.md .github_release release/api-catalog.json \
                docs/specifications/api/ docs/api-reference/ \
                docs/openapi-specs-config.json; then
                echo "::error::Open release PR #${EXISTING_PR} has different content; refusing to replace it"
                exit 1
              fi
              echo "::notice::Reusing identical open release PR #${EXISTING_PR}"
              gh pr merge "$BRANCH" --squash --auto --delete-branch
              exit 0
            fi
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              git fetch origin "$BRANCH"
              if ! git diff --cached --quiet "origin/${BRANCH}" -- \
                CHANGELOG.md .github_release release/api-catalog.json \
                docs/specifications/api/ docs/api-reference/ \
                docs/openapi-specs-config.json; then
                echo "::error::Stranded release branch ${BRANCH} has different content"
                exit 1
              fi
              echo "::notice::Reusing identical stranded release branch ${BRANCH}"
            else
              git checkout -b "$BRANCH"
              # No [skip ci]: required pull-request checks must run on every
              # generated release commit.
              git commit -m "chore: release v${VERSION} (${BUMP_TYPE})"
              git push origin "$BRANCH"
            fi

            ISSUE_TITLE="release: publish v${VERSION}"
            ISSUE_MATCHES=$(gh issue list --state all --limit 100 \
              --json number,state,title \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | [.number, .state] | @tsv")
            ISSUE_COUNT=$(printf '%s\n' "$ISSUE_MATCHES" | awk 'NF { count++ } END { print count + 0 }')
            if [ "$ISSUE_COUNT" -gt 1 ]; then
              echo "::error::Multiple release issues exist for v${VERSION}"
              exit 1
            fi
            if [ "$ISSUE_COUNT" -eq 1 ]; then
              RELEASE_ISSUE=$(printf '%s\n' "$ISSUE_MATCHES" | cut -f1)
              ISSUE_STATE=$(printf '%s\n' "$ISSUE_MATCHES" | cut -f2)
              if [ "$ISSUE_STATE" != "OPEN" ]; then
                echo "::error::Release issue #${RELEASE_ISSUE} is not open"
                exit 1
              fi
            else
              ISSUE_URL=$(gh issue create \
                --title "$ISSUE_TITLE" \
                --body "Publish the exact generated v${VERSION} release candidate after every required check and artifact verification succeeds.")
              RELEASE_ISSUE=${ISSUE_URL##*/}
            fi
            if ! [[ "$RELEASE_ISSUE" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not resolve the exact linked release issue"
              exit 1
            fi

            PR_BODY=$(printf '%s\n\n%s\n' \
              "Closes #${RELEASE_ISSUE}" \
              "Automated release v${VERSION} (${BUMP_TYPE}). Created by the sync-and-enrich workflow from the exact committed upstream receipt.")
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore: release v${VERSION} (${BUMP_TYPE})" \
              --body "$PR_BODY")

            echo "Created release PR: ${PR_URL}"

            # Enable auto-merge (squash) — merges when required checks pass
            gh pr merge "$BRANCH" --squash --auto --delete-branch
            echo "::notice::Release PR created; publication reconciles after merge"
          else
            echo "No changes to commit"
          fi

  # ==========================================================================
  # WORKFLOW MONITORING - Create issues for failures
  # ==========================================================================
  monitor-failures:
    name: Monitor Workflow Failures
    runs-on: ubuntu-latest
    needs: [check-updates, sync-and-enrich]
    if: always()
    # Ensures the monitoring labels exist and opens or updates the failure issue,
    # both as GITHUB_TOKEN.
    permissions:
      actions: read # inspect this workflow run when filing a failure
      contents: read
      issues: write # create or update the deterministic failure issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup frozen Python package manager
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.1'
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ensure monitoring labels exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ensure_labels.py

      - name: Analyze failures and create/update issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TRIGGER_EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          JOB_CHECK_UPDATES: ${{ needs.check-updates.result }}
          JOB_SYNC_ENRICH: ${{ needs.sync-and-enrich.result }}
          EXPECTED_SKIPPED_JOBS: >-
            ${{ needs.check-updates.result == 'success' &&
                needs.check-updates.outputs.has_updates != 'true' &&
                'JOB_SYNC_ENRICH' || '' }}
        run: |
          python scripts/monitor_workflow.py \
            --run-id "$RUN_ID" \
            --workflow "$WORKFLOW_NAME" \
            --event "$TRIGGER_EVENT" \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA"
