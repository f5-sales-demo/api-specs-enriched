---
name: Sync and Enrich API Specs

on:
  # Primary path: f5-sales-demo/api-specs sends this the moment a spec release
  # publishes, so a correction is consumed in minutes instead of waiting for the
  # cron below. See f5-sales-demo/api-specs#693.
  repository_dispatch:
    types: [upstream-specs-released]
  schedule:
    # Safety net, not the primary path: catches an upstream release whose
    # dispatch never arrived (token expiry, an api-specs run that died after
    # publishing, a hand-cut release).
    - cron: '0 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/sync-and-enrich.yml'
      - 'docs/**/*.html'
  workflow_dispatch:
    inputs:
      force_release:
        description: >-
          Publish a release even when the enriched specifications are unchanged.
          For changes to what this repository publishes ABOUT the specifications —
          the api-catalog.json contract, the publication receipt — which produce no
          diff under docs/specifications/api and so never trip the output-driven
          gate. Generated output must still exist; this cannot publish an empty
          bundle.
        type: boolean
        default: false

# Read-only default; each job declares only what it consumes. Compute jobs remain
# read-only and receive no release environment or publication credential. The
# socketless coordinator owns release PR/tag writes, the socketless publisher
# verifies the compute handoff before release publication, deploy-docs owns its
# Pages scopes, and monitor-failures owns issue reporting.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release-PR merge can trigger a new main run while its package handoff is
  # still publishing. Queue that run instead of cancelling the verified release.
  cancel-in-progress: false

env:
  # Exact version pre-populated in the immutable runner tool cache.
  PYTHON_VERSION: '3.13.7'

jobs:
  check-updates:
    name: Check for Updates
    runs-on: managed-socketless
    outputs:
      has_updates: ${{ steps.check.outputs.updated }}
      etag: ${{ steps.check.outputs.etag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log upstream release trigger
        if: github.event_name == 'repository_dispatch'
        env:
          # client_payload is attacker-influenceable in principle, so it is read
          # through the environment and never interpolated into this run: body.
          # It is logged only -- nothing downstream branches on it.
          UPSTREAM_TAG: ${{ github.event.client_payload.release_tag }}
          UPSTREAM_SOURCE: ${{ github.event.client_payload.trigger_source }}
        run: |
          echo "::notice::Triggered by upstream release ${UPSTREAM_TAG:-unknown} from ${UPSTREAM_SOURCE:-unknown}"

      - name: Check for GitHub Release updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Force download on push, manual dispatch and upstream release
          # dispatch; check-only on schedule.
          #
          # repository_dispatch must force: it only ever arrives because
          # api-specs just published a release, and taking the --check-only
          # ETag short-circuit here would let the trigger fire and change
          # nothing -- automation that looks wired up and is not.
          if [ "$EVENT_NAME" = "push" ] || \
            [ "$EVENT_NAME" = "workflow_dispatch" ] || \
            [ "$EVENT_NAME" = "repository_dispatch" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "Event '$EVENT_NAME' - forcing download"
          else
            # Run check-only and capture exit code
            # Exit code 1 = updates available (success for our purposes)
            # Exit code 0 = no updates (also success)
            # Other codes = actual error
            set +e
            python -m scripts.download --check-only
            EXIT_CODE=$?
            set -e

            if [ $EXIT_CODE -eq 1 ]; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              echo "Updates detected - will proceed with download"
              exit 0
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "No updates detected"
              exit 0
            else
              echo "::error::Download check failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            fi
          fi

  sync-and-enrich:
    name: Sync and Enrich Specifications
    needs: check-updates
    if: needs.check-updates.outputs.has_updates == 'true'
    runs-on: api-specs-enriched-compute
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
      candidate_manifest_digest: ${{ steps.candidate.outputs.manifest_digest }}
      upstream_digest: sha256:${{ steps.specs-fingerprint.outputs.hash }}
      pipeline_fingerprint: sha256:${{ steps.pipeline-fingerprint.outputs.hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history needed for git describe --tags
          fetch-tags: true  # Explicitly fetch tags for version calculation

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # A release-producing event must consume fresh upstream bytes. The old
      # specs/original cache could make a forced push or dispatch silently
      # enrich the previous upstream release.
      - name: Download specifications from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.download --force

      - name: Compute specs fingerprint
        id: specs-fingerprint
        run: |
          HASH=$(find specs/original -name '*.json' -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Compute pipeline code fingerprint
        id: pipeline-fingerprint
        run: |
          HASH=$({
            cat \
              scripts/pipeline.py \
              scripts/merge_specs.py \
              scripts/enrich.py \
              scripts/normalize.py \
              requirements.txt
            find scripts/utils scripts/discovery config -type f 2>/dev/null \
              | sort | xargs cat
          } | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Verify image-resident Biome
        id: biome
        run: |
          version=$(biome --version | awk '{print $2}')
          test "${version}" = "2.5.6"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Biome ${version} supplied by the immutable runner image"

      - name: Restore enriched output cache
        if: github.event_name != 'workflow_dispatch'
        id: enriched-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/specifications/api
          key: enriched-${{ steps.specs-fingerprint.outputs.hash }}-${{ steps.pipeline-fingerprint.outputs.hash }}-biome-${{ steps.biome.outputs.version }}

      - name: Use image-resident Java 17 (for LanguageTool)
        if: steps.enriched-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          java_home=/usr/lib/jvm/java-17-openjdk-amd64
          "${java_home}/bin/java" -version 2>&1 | grep -F '17.0.19'
          echo "JAVA_HOME=${java_home}" >> "$GITHUB_ENV"
          echo "${java_home}/bin" >> "$GITHUB_PATH"

      - name: Setup Node.js for Spectral
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'

      - name: Install Spectral CLI
        run: |
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check for Discovery Data
        id: check-discovery
        run: |
          # Check for session.json (metadata) since openapi.json is gitignored due to size
          if [ -f "specs/discovered/session.json" ]; then
            echo "has_discovery=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Discovery session found - discovery enrichment available locally"
          else
            echo "has_discovery=false" >> "$GITHUB_OUTPUT"
            echo "No discovery data - running standard enrichment"
          fi
          # Check for full openapi.json (required for constraint analysis)
          # This is gitignored due to 26MB size, only available when run locally
          if [ -f "specs/discovered/openapi.json" ]; then
            echo "has_full_discovery=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_full_discovery=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Full discovery openapi.json not available - constraint analysis skipped"
          fi

      - name: Run enrichment pipeline
        if: steps.enriched-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/workload-profile"
          runner-profile --name enrichment-pipeline --output "$RUNNER_TEMP/workload-profile/enrichment-pipeline.json" -- python -m scripts.pipeline --workers 8
          python -m scripts.workload_evidence evidence \
            --tree docs/specifications/api \
            --archive "$RUNNER_TEMP/workload-profile/enrichment-output.zip" \
            --output "$RUNNER_TEMP/workload-profile/enrichment-evidence.json"
          python -m scripts.workload_evidence enrich-profile --profile "$RUNNER_TEMP/workload-profile/enrichment-pipeline.json" \
            --evidence "$RUNNER_TEMP/workload-profile/enrichment-evidence.json" --memory reports/memory-profile.json
        env:
          DISCOVERY_ENRICHMENT_ENABLED: ${{ steps.check-discovery.outputs.has_discovery }}

      - name: Generate constraint analysis report
        if: steps.check-discovery.outputs.has_full_discovery == 'true' && steps.enriched-cache.outputs.cache-hit != 'true'
        run: runner-profile --name constraint-analysis --output "$RUNNER_TEMP/workload-profile/constraint-analysis.json" -- python -m scripts.analyze_constraints

      - name: Compile API catalog
        run: runner-profile --name catalog --output "$RUNNER_TEMP/workload-profile/catalog.json" -- python -m scripts.compile_catalog --input docs/specifications/api/openapi.json --output release/api-catalog.json

      - name: Gate consecutive upstream contract removals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.upstream_contract_removals

      - name: Save enriched output cache
        if: steps.enriched-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/specifications/api
          key: enriched-${{ steps.specs-fingerprint.outputs.hash }}-${{ steps.pipeline-fingerprint.outputs.hash }}-biome-${{ steps.biome.outputs.version }}

      - name: Generate API viewer pages
        run: runner-profile --name viewer --output "$RUNNER_TEMP/workload-profile/viewer.json" -- python -m scripts.generate_api_viewer

      - name: Lint specifications with Spectral
        run: runner-profile --name spectral --output "$RUNNER_TEMP/workload-profile/spectral.json" -- python scripts/lint.py --input-dir docs/specifications/api --fail-on-error --fail-on-warning

      - name: Validate specifications
        run: runner-profile --name validation --output "$RUNNER_TEMP/workload-profile/validation.json" -- python -m scripts.validate --dry-run

      - name: Detect release-worthy changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Inert on every trigger except a dispatch that asks for it.
          FORCE_RELEASE: ${{ inputs.force_release || false }}
        # Output-driven gate: compares the generated, tracked output in the
        # working tree against HEAD. Lives in a script so it can be unit
        # tested (tests/shell/test_detect_release_changes.py) — the inline
        # block it replaces was untestable, which is how #1094 survived.
        run: bash scripts/release/detect-release-changes.sh

      - name: Bump version
        id: version
        if: steps.detect.outputs.has_changes == 'true'
        env:
          CHANGE_TYPE: ${{ steps.detect.outputs.change_type }}
        run: bash scripts/release/calculate-version.sh

      - name: Update version in specs
        if: steps.detect.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          echo "Updating specs to version: $VERSION"

          # OpenAPI documents use info.version; auxiliary build artifacts use a
          # top-level version; self-describing $schema artifacts keep their own
          # format version. Keep this aligned with the contract-diff gate.
          python -m scripts.stamp_release_version \
            docs/specifications/api \
            --version "$VERSION"

          echo "Updated all specs to version $VERSION"

      - name: Verify version consistency
        if: steps.detect.outputs.has_changes == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          INDEX_VERSION=$(jq -r '.version' docs/specifications/api/index.json)

          if [ "$EXPECTED_VERSION" != "$INDEX_VERSION" ]; then
            echo "::error::Version mismatch! Expected=$EXPECTED_VERSION but index.json=$INDEX_VERSION"
            exit 1
          fi

          echo "Version consistent: $INDEX_VERSION"

      - name: Align catalog version with release
        if: steps.detect.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          if [ -f release/api-catalog.json ]; then
            jq --arg v "$VERSION" '.version = $v' release/api-catalog.json > /tmp/catalog.json
            mv /tmp/catalog.json release/api-catalog.json
            echo "Catalog version aligned to $VERSION"
          fi

      - name: Verify source version coherence
        if: steps.detect.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          python -m scripts.verify_release_version \
            --version "$VERSION" \
            --tag "v$VERSION" \
            --document docs/specifications/api/openapi.json \
            --document docs/specifications/api/index.json \
            --document docs/specifications/api/concurrency_contracts.json \
            --document docs/specifications/api/smsv2_parity_manifest.json \
            --document release/api-catalog.json

      - name: Generate discovery summary
        id: discovery-summary
        if: steps.check-discovery.outputs.has_discovery == 'true'
        run: |
          if [ -f "specs/discovered/session.json" ]; then
            ENDPOINTS=$(jq -r '.statistics.endpoints_total // 0' specs/discovered/session.json)
            SUCCESS=$(jq -r '.statistics.endpoints_successful // 0' specs/discovered/session.json)
            TIMESTAMP=$(jq -r '.started_at // "unknown"' specs/discovered/session.json)
            {
              echo "endpoints_total=$ENDPOINTS"
              echo "endpoints_success=$SUCCESS"
              echo "discovery_timestamp=$TIMESTAMP"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Discovery: ${SUCCESS}/${ENDPOINTS} endpoints discovered at ${TIMESTAMP}"
          fi

      - name: Generate changelog
        if: steps.detect.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
          BUMP_TYPE: ${{ steps.version.outputs.bump_type }}
          HAS_DISCOVERY: ${{ steps.check-discovery.outputs.has_discovery }}
          DISCOVERY_ENDPOINTS: ${{ steps.discovery-summary.outputs.endpoints_total }}
          DISCOVERY_SUCCESS: ${{ steps.discovery-summary.outputs.endpoints_success }}
          DISCOVERY_TIMESTAMP: ${{ steps.discovery-summary.outputs.discovery_timestamp }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          # Extract upstream info from index.json
          UPSTREAM_TS=$(jq -r '."x-upstream-timestamp" // "unknown"' docs/specifications/api/index.json)
          UPSTREAM_ETAG=$(jq -r '."x-upstream-etag" // "unknown"' docs/specifications/api/index.json)
          ENRICHED_VER=$(jq -r '."x-enriched-version" // "'"$VERSION"'"' docs/specifications/api/index.json)
          FULL_VERSION=$(jq -r '.version' docs/specifications/api/index.json)

          # Discovery info (if available) arrives via env — see the step's env block.

          # Preserve existing changelog entries (prepend-only strategy to avoid merge conflicts)
          EXISTING_ENTRIES=""
          if [ -f CHANGELOG.md ]; then
            # Extract everything after the first "## Version" header (skip header + first entry)
            EXISTING_ENTRIES=$(awk '/^## Version/{if(++c==2)found=1}found' CHANGELOG.md || echo "")
          fi

          # Calculate statistics
          ORIG_SPECS=$(find specs/original -name '*.json' 2>/dev/null | wc -l | xargs)
          DOMAIN_COUNT=$(jq '.specifications | length' docs/specifications/api/index.json)
          PATH_COUNT=$(jq '[.specifications[].path_count] | add' docs/specifications/api/index.json)
          SCHEMA_COUNT=$(jq '[.specifications[].schema_count] | add' docs/specifications/api/index.json)

          # Write changelog directly to avoid heredoc YAML parsing issues
          {
            echo "# Changelog"
            echo ""
            echo "## Version $FULL_VERSION ($DATE)"
            echo ""
            echo "### Version Information"
            echo "- **Full Version**: $FULL_VERSION"
            echo "- **Upstream Timestamp**: $UPSTREAM_TS"
            echo "- **Upstream ETag**: $UPSTREAM_ETAG"
            echo "- **Enriched Version**: $ENRICHED_VER"
            echo ""
            echo "### Release Type"
            echo "- **$BUMP_TYPE** release"
            echo ""
            echo "### Changes"
            echo "- Updated API specifications from F5 Distributed Cloud"
            echo "- Applied enrichment pipeline:"
            echo "  - Acronym normalization (100+ terms)"
            echo "  - Grammar improvements"
            echo "  - Branding updates (Volterra → F5 Distributed Cloud)"
            echo "- Applied normalization pipeline:"
            echo "  - Fixed orphan \$ref references"
            echo "  - Removed empty operations"
            echo "  - Type standardization"
            echo "- Validated with Spectral OpenAPI linter"
            echo "- Merged specifications by domain"
            echo ""
            echo "### Statistics"
            echo "- Original specs: $ORIG_SPECS"
            echo "- Domains: $DOMAIN_COUNT"
            echo "- Total paths: $PATH_COUNT"
            echo "- Total schemas: $SCHEMA_COUNT"

            # Add discovery section if available
            if [ "$HAS_DISCOVERY" = "true" ] && [ -n "$DISCOVERY_ENDPOINTS" ]; then
              echo ""
              echo "### API Discovery Enrichment"
              echo "- Discovery timestamp: $DISCOVERY_TIMESTAMP"
              echo "- Endpoints explored: $DISCOVERY_SUCCESS / $DISCOVERY_ENDPOINTS"
              echo "- Applied x-discovered-* extensions from live API exploration"
              echo "- See \\\`reports/constraint-analysis.md\\\` for detailed comparison"
            fi

            echo ""
            echo "### Output Structure"
            echo "\\\`\\\`\\\`text"
            echo "docs/specifications/api/"
            echo "├── [domain].json        # Domain-specific specs"
            echo "├── openapi.json         # Master combined spec"
            echo "└── index.json           # Metadata index"
            echo "\\\`\\\`\\\`"
            echo ""
            echo "### Download"
            echo "- ZIP Package: F5xc-api-(${UPSTREAM_TS}-${ENRICHED_VER}).zip"
            echo ""
            echo "### Source"
            echo "- Source: F5 Distributed Cloud OpenAPI specifications"
            echo "- Upstream: $UPSTREAM_TS (ETag: $UPSTREAM_ETAG)"
            echo ""

            # Append existing entries
            if [ -n "$EXISTING_ENTRIES" ]; then
              echo "$EXISTING_ENTRIES"
            fi
          } > CHANGELOG.md

      - name: Biome-format generated JSON for release PR
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          # json_writer.py formats per-file during generation, but Biome batch
          # formatting can differ. Normalize the complete generated trees before
          # the candidate manifest binds their bytes.
          biome format --write docs/specifications/api/ docs/api-reference/ || true

      - name: Revalidate formatted specifications
        if: steps.detect.outputs.has_changes == 'true'
        run: python -m scripts.validate --dry-run

      - name: Build schema-v1 release candidate handoff
        id: candidate
        if: steps.detect.outputs.has_changes == 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          UPSTREAM_DIGEST: sha256:${{ steps.specs-fingerprint.outputs.hash }}
          VERSION: ${{ steps.version.outputs.new_version }}
          PIPELINE_FINGERPRINT: sha256:${{ steps.pipeline-fingerprint.outputs.hash }}
        run: |
          manifest_digest=$(python -m scripts.release_handoff candidate-create \
            --root . \
            --stage "$RUNNER_TEMP/release-candidate" \
            --source-commit "$SOURCE_COMMIT" \
            --upstream-digest "$UPSTREAM_DIGEST" \
            --version "$VERSION" \
            --pipeline-fingerprint "$PIPELINE_FINGERPRINT" \
            --path CHANGELOG.md \
            --path .github_release \
            --path docs/specifications/api \
            --path docs/api-reference \
            --path release/api-catalog.json \
            --path release/upstream-contract-removals.json \
            --path release/upstream-contract-removals.md)
          echo "manifest_digest=$manifest_digest" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate handoff
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload workload profiles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workload-profile-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workload-profile/*.json
          if-no-files-found: warn
          retention-days: 30

  release-coordinator:
    name: Coordinate Release
    needs: sync-and-enrich
    if: needs.sync-and-enrich.outputs.has_changes == 'true'
    runs-on: managed-socketless
    environment: release
    permissions:
      contents: write # Create the release branch and tag through the coordinator.
      statuses: write # Post the release-branch linked-issue exemption context.
    outputs:
      target_commit: ${{ steps.release.outputs.target_commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Verify candidate and coordinate release PR
        id: release
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
          CANDIDATE_MANIFEST_DIGEST: ${{ needs.sync-and-enrich.outputs.candidate_manifest_digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          UPSTREAM_DIGEST: ${{ needs.sync-and-enrich.outputs.upstream_digest }}
          VERSION: ${{ needs.sync-and-enrich.outputs.version }}
          PIPELINE_FINGERPRINT: ${{ needs.sync-and-enrich.outputs.pipeline_fingerprint }}
          BUMP_TYPE: ${{ needs.sync-and-enrich.outputs.bump_type }}
          GH_TOKEN: ${{ secrets.VERSION_BUMP_PAT }}
          RELEASE_STATUS_TOKEN: ${{ github.token }}
        run: bash scripts/release/coordinator.sh

  build-release-package:
    name: Build Release Package
    needs: [sync-and-enrich, release-coordinator]
    if: needs.sync-and-enrich.outputs.has_changes == 'true'
    runs-on: api-specs-enriched-compute
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      artifact_digest: ${{ steps.payload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-coordinator.outputs.target_commit }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Download candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Verify merged candidate identity
        env:
          CANDIDATE_MANIFEST_DIGEST: ${{ needs.sync-and-enrich.outputs.candidate_manifest_digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          UPSTREAM_DIGEST: ${{ needs.sync-and-enrich.outputs.upstream_digest }}
          VERSION: ${{ needs.sync-and-enrich.outputs.version }}
          PIPELINE_FINGERPRINT: ${{ needs.sync-and-enrich.outputs.pipeline_fingerprint }}
        run: |
          python -m scripts.release_handoff candidate-verify \
            --root . \
            --manifest "$RUNNER_TEMP/release-candidate/.handoff/candidate-manifest.json" \
            --manifest-digest "$CANDIDATE_MANIFEST_DIGEST" \
            --source-commit "$SOURCE_COMMIT" \
            --upstream-digest "$UPSTREAM_DIGEST" \
            --version "$VERSION" \
            --pipeline-fingerprint "$PIPELINE_FINGERPRINT"
      - name: Build deterministic release assets
        id: package
        env:
          VERSION: ${{ needs.sync-and-enrich.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-coordinator.outputs.target_commit }}
          CANDIDATE_MANIFEST: ${{ runner.temp }}/release-candidate/.handoff/candidate-manifest.json
          OUTPUT_DIR: ${{ runner.temp }}/release-payload
        run: bash scripts/release/build-package.sh
      - name: Name package artifact
        id: names
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: echo "artifact_name=release-payload-${RUN_ID}-${RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload release package
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-payload
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Create schema-v1 package handoff
        env:
          VERSION: ${{ needs.sync-and-enrich.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-coordinator.outputs.target_commit }}
          ARTIFACT_NAME: ${{ steps.names.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          python -m scripts.release_handoff package-create \
            --root "$RUNNER_TEMP/release-payload" \
            --candidate-manifest "$RUNNER_TEMP/release-payload/.handoff/candidate-manifest.json" \
            --release-commit "$RELEASE_COMMIT" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --archive "f5xc-api-specs-v${VERSION}.zip" \
            --asset "f5xc-api-specs-v${VERSION}.zip" \
            --asset docs/specifications/api/openapi.json \
            --asset docs/specifications/api/index.json \
            --asset docs/specifications/api/minimal-export-defaults.json \
            --asset docs/specifications/api/concurrency_contracts.json \
            --asset docs/specifications/api/smsv2_parity_manifest.json \
            --asset release/api-catalog.json \
            --asset release/upstream-contract-removals.json \
            --asset release-package/smsv2-contract.json \
            --asset release-package/smsv2-evidence-receipt.json \
            --asset release-package/smsv2-contract-manifest.json \
            --output "$RUNNER_TEMP/package-handoff.json"
      - name: Upload package handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-handoff.json
          if-no-files-found: error
          retention-days: 1
      - name: Upload docs artifact for deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: docs
          retention-days: 1

  release-publisher:
    name: Publish Release
    needs: [sync-and-enrich, release-coordinator, build-release-package]
    if: needs.sync-and-enrich.outputs.has_changes == 'true'
    runs-on: managed-socketless
    environment: release
    permissions:
      actions: read # Resolve the uploaded package artifact server-side digest.
      contents: write # Release coordinator or publisher write scope; see the job comment.
    outputs:
      has_changes: ${{ needs.sync-and-enrich.outputs.has_changes }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-coordinator.outputs.target_commit }}
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-release-package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-payload
      - name: Download package handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-handoff
      - name: Verify handoff and publish release
        env:
          VERSION: ${{ needs.sync-and-enrich.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release-coordinator.outputs.target_commit }}
          PAYLOAD_DIR: ${{ runner.temp }}/release-payload
          HANDOFF_PATH: ${{ runner.temp }}/release-handoff/package-handoff.json
          ARTIFACT_NAME: ${{ needs.build-release-package.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.build-release-package.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          server_digest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --paginate --jq --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].digest else empty end')
          [ "$server_digest" = "$ARTIFACT_DIGEST" ] || {
            echo "::error::Package artifact digest does not match GitHub metadata"
            exit 1
          }
          bash scripts/release/publish-package.sh


  deploy-docs:
    name: Deploy Documentation
    needs: [sync-and-enrich, build-release-package]
    if: needs.sync-and-enrich.outputs.has_changes == 'true'
    runs-on: managed-socketless
    # actions/deploy-pages needs both of these; id-token is for its OIDC exchange.
    permissions:
      contents: read
      pages: write # Publish the generated documentation artifact to GitHub Pages.
      id-token: write # Exchange an OIDC token with the GitHub Pages deployment service.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # ==========================================================================
  # NOTIFY DOWNSTREAM REPOSITORIES
  # Reads config/downstream_repos.yaml and dispatches to enabled repos only.
  # ==========================================================================
  build-downstream-matrix:
    name: Build Downstream Matrix
    needs: [sync-and-enrich, release-publisher]
    if: needs.sync-and-enrich.outputs.has_changes == 'true'
    runs-on: managed-socketless
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify installed PyYAML
        run: python -c "import yaml; print(yaml.__version__)"

      - name: Build matrix from config
        id: matrix
        run: |
          # Parse downstream_repos.yaml and filter to enabled repos
          MATRIX=$(python3 -c "
          import json, yaml, sys
          with open('config/downstream_repos.yaml') as f:
              cfg = yaml.safe_load(f)
          repos = cfg.get('downstream_repositories', [])
          enabled = [
              {'owner': r['owner'], 'repo': r['repo'], 'event_type': r['event_type']}
              for r in repos if r.get('enabled', False)
          ]
          print(json.dumps({'downstream': enabled}))
          ")
          echo "result=${MATRIX}" >> "$GITHUB_OUTPUT"
          # Check if there are any targets
          COUNT=$(echo "${MATRIX}" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['downstream']))")
          if [ "${COUNT}" -gt 0 ]; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found ${COUNT} enabled downstream repo(s)"
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No enabled downstream repos found - skipping dispatch"
          fi

  notify-downstream:
    name: Notify Downstream Repositories
    needs: [sync-and-enrich, release-coordinator, build-downstream-matrix]
    if: needs.build-downstream-matrix.outputs.has_targets == 'true'
    runs-on: managed-socketless
    environment: downstream-dispatch
    strategy:
      matrix: ${{ fromJSON(needs.build-downstream-matrix.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch to ${{ matrix.downstream.repo }}
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          TARGET_OWNER: ${{ matrix.downstream.owner }}
          TARGET_REPO: ${{ matrix.downstream.repo }}
          EVENT_TYPE: ${{ matrix.downstream.event_type }}
          VERSION: ${{ needs.sync-and-enrich.outputs.version }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_TARGET_COMMIT: ${{ needs.release-coordinator.outputs.target_commit }}
        run: bash scripts/release/dispatch-downstream.sh

      - name: Log dispatch result
        env:
          DS_OWNER: ${{ matrix.downstream.owner }}
          DS_REPO: ${{ matrix.downstream.repo }}
          DS_EVENT: ${{ matrix.downstream.event_type }}
          DS_VERSION: ${{ needs.sync-and-enrich.outputs.version }}
        run: |
          echo "::notice::Dispatched '${DS_EVENT}' to ${DS_OWNER}/${DS_REPO}"
          echo "Version: ${DS_VERSION}"

  # ==========================================================================
  # WORKFLOW MONITORING - Create issues for failures
  # ==========================================================================
  monitor-failures:
    name: Monitor Workflow Failures
    runs-on: managed-socketless
    needs: [check-updates, sync-and-enrich, release-coordinator, build-release-package, release-publisher, deploy-docs, build-downstream-matrix, notify-downstream]
    if: always()
    # Ensures the monitoring labels exist and opens or updates the failure issue,
    # both as GITHUB_TOKEN.
    permissions:
      contents: read
      issues: write # Create or update the repository issue that records workflow failures.
    steps:
      - name: Check for failures
        id: check_failure
        env:
          CHECK_UPDATES_RESULT: ${{ needs.check-updates.result }}
          SYNC_AND_ENRICH_RESULT: ${{ needs.sync-and-enrich.result }}
          RELEASE_COORDINATOR_RESULT: ${{ needs.release-coordinator.result }}
          BUILD_RELEASE_PACKAGE_RESULT: ${{ needs.build-release-package.result }}
          RELEASE_PUBLISHER_RESULT: ${{ needs.release-publisher.result }}
          DEPLOY_DOCS_RESULT: ${{ needs.deploy-docs.result }}
          BUILD_DOWNSTREAM_MATRIX_RESULT: ${{ needs.build-downstream-matrix.result }}
          NOTIFY_DOWNSTREAM_RESULT: ${{ needs.notify-downstream.result }}
        run: |
          # Check if any job failed
          if [ "$CHECK_UPDATES_RESULT" = "failure" ] || \
            [ "$SYNC_AND_ENRICH_RESULT" = "failure" ] || \
            [ "$RELEASE_COORDINATOR_RESULT" = "failure" ] || \
            [ "$BUILD_RELEASE_PACKAGE_RESULT" = "failure" ] || \
            [ "$RELEASE_PUBLISHER_RESULT" = "failure" ] || \
            [ "$DEPLOY_DOCS_RESULT" = "failure" ] || \
            [ "$BUILD_DOWNSTREAM_MATRIX_RESULT" = "failure" ] || \
            [ "$NOTIFY_DOWNSTREAM_RESULT" = "failure" ]; then
            echo "has_failure=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Workflow failure detected - will create issue"
          else
            echo "has_failure=false" >> "$GITHUB_OUTPUT"
            echo "All jobs completed successfully"
          fi

      - name: Checkout repository
        if: steps.check_failure.outputs.has_failure == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        if: steps.check_failure.outputs.has_failure == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_failure.outputs.has_failure == 'true'
        run: pip install -r requirements.txt

      - name: Ensure monitoring labels exist
        if: steps.check_failure.outputs.has_failure == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/ensure_labels.py

      - name: Analyze failures and create/update issues
        if: steps.check_failure.outputs.has_failure == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TRIGGER_EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          JOB_CHECK_UPDATES: ${{ needs.check-updates.result }}
          JOB_SYNC_ENRICH: ${{ needs.sync-and-enrich.result }}
          JOB_DEPLOY: ${{ needs.deploy-docs.result }}
          JOB_BUILD_MATRIX: ${{ needs.build-downstream-matrix.result }}
          JOB_NOTIFY_DOWNSTREAM: ${{ needs.notify-downstream.result }}
        run: |
          python scripts/monitor_workflow.py \
            --run-id "$RUN_ID" \
            --workflow "$WORKFLOW_NAME" \
            --event "$TRIGGER_EVENT" \
            --branch "$BRANCH" \
            --commit "$COMMIT_SHA"
